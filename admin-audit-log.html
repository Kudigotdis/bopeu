<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Log · BOPEU Admin</title>
<link rel="stylesheet" href="design-system.css">
<style>
  body.bop { background:#F2F5F9; }
  .admin-header { background:#1A202C; color:#fff; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:20; }
  .admin-brand { display:flex; align-items:center; gap:10px; }
  .admin-mark { width:32px; height:32px; border-radius:8px; background:#D32F2F; display:grid; place-items:center; font-weight:800; color:#fff; }
  .admin-nav { display:flex; gap:16px; font-size:13px; }
  .admin-nav a { color:#fff; text-decoration:none; font-weight:600; opacity:.85; }
  .admin-layout { display:grid; grid-template-columns:220px 1fr; min-height:calc(100vh - 56px); }
  .admin-side { background:#fff; border-right:1px solid #E2E8F0; padding:16px 12px; }
  .admin-side a { display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:8px; font-size:13px; font-weight:600; color:#4A5568; text-decoration:none; margin-bottom:2px; }
  .admin-side a.active { background:#FFEBEE; color:#D32F2F; }
  .admin-main { padding:24px; max-width:1100px; }
  .log-list { background:#fff; border:1px solid #E2E8F0; border-radius:12px; overflow:hidden; }
  .log-row { padding:12px 16px; border-bottom:1px solid #E2E8F0; font-size:13px; display:grid; grid-template-columns:160px 1fr 120px; gap:12px; align-items:center; }
  .log-row:last-child { border-bottom:0; }
  .log-row:hover { background:#FAFBFD; }
  .log-time { font-family:ui-monospace,monospace; color:#718096; font-size:12px; }
  .log-user { color:#D32F2F; font-weight:700; }
  @media (max-width:820px) { .admin-layout { grid-template-columns:1fr; } .admin-side { display:none; } .log-row { grid-template-columns:1fr; gap:4px; } }
</style>
</head>
<body data-page-id="Page-admin-audit-log" class="bop">

<header class="admin-header">
  <div class="admin-brand">
    <div class="admin-mark">B</div>
    <div><div style="font-weight:800; font-size:14px;">BOPEU Admin</div><div style="font-size:10px; opacity:.7;">Staff Portal</div></div>
  </div>
  <nav class="admin-nav">
    <a href="admin-dashboard.html">Dashboard</a>
    <a href="admin-submissions.html">Submissions</a>
    <a href="admin-members.html">Members</a>
    <a href="admin-content.html">Content</a>
    <a href="admin-reports.html">Reports</a>
    <a href="admin-login.html">Sign out</a>
  </nav>
</header>

<div class="admin-layout">
  <aside class="admin-side">
    <a href="admin-dashboard.html">📊 Dashboard</a>
    <a href="admin-submissions.html">📥 Submissions</a>
    <a href="admin-members.html">👥 Members</a>
    <a href="admin-content.html">📰 Content</a>
    <a href="admin-users-roles.html">🔐 Users &amp; Roles</a>
    <a href="admin-audit-log.html" class="active">📜 Audit Log</a>
    <a href="admin-reports.html">📈 Reports</a>
  </aside>

  <main class="admin-main">
    <h1 style="font-size:22px;font-weight:800;margin-bottom:4px;">Audit Log</h1>
    <p style="color:#718096;font-size:14px;margin-bottom:20px;">Chronological record of staff actions on member records. Read-only.</p>

    <div class="card">
      <div class="card-header"><h2>Recent events</h2></div>
      <div class="card-body">
        <div class="log-list" id="auditLogList"></div>
      </div>
    </div>
  </main>
</div>

<div class="modal" id="admin-modal" data-view-id="Page-admin-audit-log-admin-modal" style="position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(15,23,32,.55);">
  <div style="width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:#fff;border-radius:16px;padding:20px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #E2E8F0;">
      <h2 style="font-size:18px;font-weight:800;margin:0;" id="adminModalTitle">Admin</h2>
      <button style="background:none;border:none;font-size:24px;cursor:pointer;color:#718096;" onclick="closeModal('admin-modal')">&times;</button>
    </div>
    <div id="adminModalBody"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/demo-profiles.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
<script>
  var DEMO_AUDIT = [
    { at: '2026-09-20T14:32:00Z', user: 'k.modise@bopeu.org.bw',  action: 'Signed in (WhatsApp identity + password)' },
    { at: '2026-09-20T14:35:00Z', user: 'k.modise@bopeu.org.bw',  action: 'Viewed member BOPEU-37K-1003 (Tumelo Rantao)' },
    { at: '2026-09-20T14:38:00Z', user: 'n.sekgoma@bopeu.org.bw', action: 'Approved submission BUI-1730000004' },
    { at: '2026-09-20T15:01:00Z', user: 'n.sekgoma@bopeu.org.bw', action: 'Added comment on BUR-1730000001' },
    { at: '2026-09-19T11:12:00Z', user: 't.molefe@bopeu.org.bw',  action: 'Published notice "Monthly Subscription Deduction"' },
    { at: '2026-09-19T09:45:00Z', user: 'k.modise@bopeu.org.bw',  action: 'Invited new staff user n.sekgoma@bopeu.org.bw' },
    { at: '2026-09-18T16:20:00Z', user: 'r.mogwe@bopeu.org.bw',   action: 'Exported Q3 submissions report' }
  ];

  function renderAudit() {
    var custom = LocalStore.get('bopeu_audit_extra') || [];
    var rows = custom.concat(DEMO_AUDIT);
    document.getElementById('auditLogList').innerHTML = rows.map(function (r) {
      return '<div class="log-row">' +
        '<div class="log-time">' + new Date(r.at).toLocaleString() + '</div>' +
        '<div><span class="log-user">' + r.user + '</span> — ' + r.action + '</div>' +
        '<div style="text-align:right;"><span class="badge badge-grey">logged</span></div>' +
        '</div>';
    }).join('');
  }

  document.addEventListener('DOMContentLoaded', renderAudit);
</script>
</body>
</html>
