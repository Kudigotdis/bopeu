<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Partner Onboarding · BOPEU</title>
<link rel="stylesheet" href="design-system.css">
</head>
<body class="bop">
<header style="background:#0F7A4D;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;">
  <div style="display:flex;align-items:center;gap:10px;"><div style="width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:800;">B</div><div><div style="font-weight:800;font-size:14px;">Become a BOPEU Partner</div><div style="font-size:10px;opacity:.8;">Onboarding</div></div></div>
  <a href="public-landing.html" style="color:#fff;text-decoration:none;font-weight:600;opacity:.85;font-size:13px;">← Home</a>
</header>
<main class="page stack">
  <div class="card">
    <div class="card-head"><h2>Partner application</h2><div class="card-sub">Reach 37,000+ public sector employees with a benefit offer. Verify your business details below.</div></div>
    <div class="card-body" style="padding:20px;">
      <h3 style="font-size:14px;font-weight:800;margin-bottom:12px;">1. Business details</h3>
      <div class="form-group"><label class="form-label">Business name *</label><input type="text" id="bizName"></div>
      <div class="form-group"><label class="form-label">Business registration number *</label><input type="text" id="bizReg"></div>
      <div class="form-group"><label class="form-label">Category *</label><select id="category"><option>Health</option><option>Finance</option><option>Insurance</option><option>Travel</option><option>Hardware</option><option>Telecom</option><option>Other</option></select></div>
      <div class="form-group"><label class="form-label">Business address</label><input type="text" id="address"></div>

      <h3 style="font-size:14px;font-weight:800;margin:24px 0 12px;">2. Primary contact</h3>
      <div class="form-group"><label class="form-label">Full name *</label><input type="text" id="contactName"></div>
      <div class="form-group"><label class="form-label">Corporate email *</label><input type="email" id="contactEmail" placeholder="you@company.co.bw"></div>
      <div class="form-group"><label class="form-label">Phone *</label><input type="tel" id="contactPhone"></div>

      <h3 style="font-size:14px;font-weight:800;margin:24px 0 12px;">3. Offer description</h3>
      <div class="form-group"><label class="form-label">What benefit will you offer BOPEU members? *</label><textarea id="offerDesc" rows="4" placeholder="e.g. 20% off all lab tests for members without medical aid"></textarea></div>
      <div class="form-group"><label class="form-label">Validity period</label><input type="text" id="validity" placeholder="e.g. 12 months"></div>

      <h3 style="font-size:14px;font-weight:800;margin:24px 0 12px;">4. Documents</h3>
      <div class="form-group"><label class="form-label">Business registration certificate</label><input type="file" accept=".pdf"></div>
      <div class="form-group"><label class="form-label">Tax clearance certificate</label><input type="file" accept=".pdf"></div>

      <div class="checklist-item"><input type="checkbox" id="agree1"><label for="agree1" style="font-size:12px;">I confirm all details are accurate and I have authority to represent this business.</label></div>
      <div class="checklist-item"><input type="checkbox" id="agree2"><label for="agree2" style="font-size:12px;">I agree to BOPEU's partner terms, including the aggregated-only data sharing rule (no member PII without consent).</label></div>

      <button class="btn btn-primary btn-block mt-md" onclick="submitApplication()">Submit application</button>
    </div>
  </div>
</main>
<script>
function submitApplication() {
  var required = ['bizName','bizReg','contactName','contactEmail','contactPhone','offerDesc'];
  for (var i = 0; i < required.length; i++) { if (!document.getElementById(required[i]).value.trim()) { alert('Please complete all required fields.'); return; } }
  if (!document.getElementById('agree1').checked || !document.getElementById('agree2').checked) { alert('Please tick both agreements.'); return; }
  var ref = 'PARTNER-APP-' + Date.now().toString(36).toUpperCase();
  alert('Application submitted!\nReference: ' + ref + '\n\nBOPEU partnerships team will review within 10 working days.');
}
</script>

<script src="js/demo-profiles.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
