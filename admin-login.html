<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Sign In · BOPEU Admin</title>
<link rel="stylesheet" href="design-system.css">
<link rel="stylesheet" href="css/auth.css">
<style>
  body.bop { background: #0F1720; }
  .admin-login-wrap { min-height:100vh; display:grid; place-items:center; padding:20px; }
  .admin-login-card { width:100%; max-width:440px; background:#fff; border-radius:20px; padding:28px; box-shadow: 0 24px 60px rgba(0,0,0,.4); }
  .admin-login-brand { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .admin-login-mark { width:44px; height:44px; border-radius:12px; background:#D32F2F; color:#fff; display:grid; place-items:center; font-weight:800; font-size:18px; }
  .admin-login-brand h1 { font-size:18px; margin:0; color:#1A202C; }
  .admin-login-brand p { font-size:11px; color:#718096; margin:2px 0 0; letter-spacing:.06em; }
  .admin-access-note { margin-bottom:18px; padding:11px 13px; border:1px solid #E2E8F0; border-radius:10px; background:#F7F9FC; color:#4A5568; font-size:11.5px; line-height:1.45; }
  .admin-access-note strong { display:block; color:#1A202C; font-size:10px; letter-spacing:.07em; text-transform:uppercase; margin-bottom:3px; }
  @media (max-width: 480px) { .admin-login-card { padding:20px; border-radius:16px; } .admin-login-wrap { padding:12px; } }
</style>
</head>
<body class="bop">

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <div class="admin-login-brand">
      <div class="admin-login-mark">B</div>
      <div>
        <h1>BOPEU Staff Portal</h1>
        <p>AUTHORISED STAFF ONLY</p>
      </div>
    </div>

    <div class="admin-access-note">
      <strong>Access restricted</strong>
      Staff access is logged and audited. Your role controls the pages and data you can open.
    </div>

    <div id="authPageBody"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/demo-profiles.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
