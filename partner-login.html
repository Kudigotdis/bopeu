<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Partner Sign In · BOPEU</title>
<link rel="stylesheet" href="design-system.css">
<link rel="stylesheet" href="css/auth.css">
<style>
  body.bop { background:#0F1720; }
  .pl-wrap { min-height:100vh; display:grid; place-items:center; padding:20px; }
  .pl-card { width:100%; max-width:440px; background:#fff; border-radius:20px; padding:28px; box-shadow:0 24px 60px rgba(0,0,0,.4); }
  .pl-brand { display:flex; gap:12px; align-items:center; margin-bottom:18px; }
  .pl-mark { width:44px; height:44px; border-radius:12px; background:#0F7A4D; color:#fff; display:grid; place-items:center; font-weight:800; font-size:18px; }
  .pl-brand h1 { font-size:18px; margin:0; color:#1A202C; }
  .pl-brand p { font-size:11px; color:#718096; margin:2px 0 0; letter-spacing:.06em; }
  .pl-access-note { margin-bottom:18px; padding:11px 13px; border:1px solid #E2E8F0; border-radius:10px; background:#F1FAF4; color:#276749; font-size:11.5px; line-height:1.45; }
  .pl-access-note strong { display:block; color:#0F7A4D; font-size:10px; letter-spacing:.07em; text-transform:uppercase; margin-bottom:3px; }
  @media (max-width: 480px) { .pl-card { padding:20px; border-radius:16px; } .pl-wrap { padding:12px; } }
</style>
</head>
<body data-page-id="Page-partner-login" class="bop">
<div class="pl-wrap">
  <div class="pl-card">
    <div class="pl-brand">
      <div class="pl-mark">P</div>
      <div>
        <h1>BOPEU Partner Portal</h1>
        <p>BENEFIT PARTNER ACCESS</p>
      </div>
    </div>

    <div class="pl-access-note">
      <strong>Authorised partners only</strong>
      Partner access is logged. You see only consented, aggregated member data for your organisation.
    </div>

    <div id="authPageBody"></div>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/demo-profiles.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
