<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Notifications · BOPEU</title>
<link rel="stylesheet" href="design-system.css">
</head>
<body data-page-id="Page-notification-center" class="bop">
<header style="background:#fff;border-bottom:1px solid #E2E8F0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;">
  <a href="index.html" style="display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;">
    <div style="width:32px;height:32px;border-radius:8px;background:#D32F2F;color:#fff;display:grid;place-items:center;font-weight:800;">B</div>
    <div><div style="font-weight:800;font-size:14px;">BOPEU</div><div style="font-size:10px;color:#718096;">NOTIFICATIONS</div></div>
  </a>
  <a href="profile.html" style="font-size:13px;font-weight:700;color:#D32F2F;text-decoration:none;">← Profile</a>
</header>
<main class="page stack">
  <div class="chip-row" id="filterRow">
    <button class="chip active" onclick="filterNotif('all', this)">All</button>
    <button class="chip" onclick="filterNotif('application', this)">Applications</button>
    <button class="chip" onclick="filterNotif('payment', this)">Payments</button>
    <button class="chip" onclick="filterNotif('benefit', this)">Benefits</button>
    <button class="chip" onclick="filterNotif('announcement', this)">Announcements</button>
  </div>

  <div class="card">
    <div class="card-header"><h2>Recent notifications</h2><button class="btn btn-secondary btn-small" onclick="markAllRead()">Mark all read</button></div>
    <div class="card-body">
      <div id="list"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><h2>Preferences</h2></div>
    <div class="card-body">
      <div class="checklist-item"><input type="checkbox" id="pref-app" checked><label for="pref-app">Application & claim updates</label></div>
      <div class="checklist-item"><input type="checkbox" id="pref-pay" checked><label for="pref-pay">Payment & deduction alerts</label></div>
      <div class="checklist-item"><input type="checkbox" id="pref-benefit" checked><label for="pref-benefit">New benefits & partner offers</label></div>
      <div class="checklist-item"><input type="checkbox" id="pref-union" checked><label for="pref-union">Union announcements & bargaining alerts</label></div>
      <div class="checklist-item"><input type="checkbox" id="pref-mkt"><label for="pref-mkt">Marketing & promotional messages</label></div>
      <div class="form-group mt-md"><label class="form-label">Preferred channel</label>
        <select id="prefChannel">
          <option>In-app only</option>
          <option selected>In-app + SMS</option>
          <option>In-app + WhatsApp</option>
          <option>In-app + Email</option>
        </select>
      </div>
      <button class="btn btn-primary btn-block" onclick="savePrefs()">Save preferences</button>
    </div>
  </div>
</main>
<script>
var NOTIFS = [
  { id:1, type:'application', title:'Bursary application approved', body:'Your application BUR-2026-018 was approved for P18,500. Payment scheduled.', at:'2026-10-24T14:30:00Z', read:false },
  { id:2, type:'payment', title:'October deduction processed', body:'Your P100.00 subscription was deducted on 15 Oct 2026.', at:'2026-10-15T08:00:00Z', read:true },
  { id:3, type:'benefit', title:'New partner benefit added', body:'Diagnofirm now offers 35% off lab tests for members without medical aid.', at:'2026-10-12T10:15:00Z', read:true },
  { id:4, type:'announcement', title:'Bargaining council update', body:'Public sector salary negotiations resume 1 November. Details in the app.', at:'2026-10-10T09:00:00Z', read:true },
  { id:5, type:'application', title:'Funeral claim — action needed', body:'Please submit a clearer copy of the death certificate. Claim CLM-2026-0421.', at:'2026-10-08T11:20:00Z', read:true },
  { id:6, type:'payment', title:'Refund processed', body:'P14.30 refund processed to your bank account. Ref: REF-2026-014.', at:'2026-09-28T15:00:00Z', read:true }
];

var CURRENT_FILTER = 'all';

function render() {
  var list = NOTIFS.filter(n => CURRENT_FILTER === 'all' || n.type === CURRENT_FILTER);
  if (!list.length) { document.getElementById('list').innerHTML = '<div class="empty">No notifications of this type.</div>'; return; }
  var html = '';
  list.forEach(n => {
    var icon = { application:'📋', payment:'💰', benefit:'🎁', announcement:'📢' }[n.type] || '🔔';
    html += '<div style="padding:14px 12px;border-bottom:1px solid #F0F3F7;display:flex;gap:12px;align-items:flex-start;' + (n.read ? '' : 'background:#FEF6F7;') + '">' +
      '<div style="font-size:20px;">' + icon + '</div>' +
      '<div style="flex:1;min-width:0;"><div style="font-weight:' + (n.read ? '600' : '800') + ';font-size:14px;color:#1A202C;">' + n.title + '</div>' +
      '<div style="font-size:12px;color:#718096;margin-top:3px;line-height:1.5;">' + n.body + '</div>' +
      '<div style="font-size:11px;color:#A0AEB9;margin-top:6px;">' + new Date(n.at).toLocaleString() + '</div></div>' +
      (n.read ? '' : '<div style="width:8px;height:8px;border-radius:50%;background:#D32F2F;flex-shrink:0;margin-top:6px;"></div>') +
      '</div>';
  });
  document.getElementById('list').innerHTML = html;
}

function filterNotif(kind, btn) {
  CURRENT_FILTER = kind;
  document.querySelectorAll('#filterRow .chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function markAllRead() {
  NOTIFS.forEach(n => n.read = true);
  render();
}

function savePrefs() {
  var prefs = {
    application: document.getElementById('pref-app').checked,
    payment: document.getElementById('pref-pay').checked,
    benefit: document.getElementById('pref-benefit').checked,
    union: document.getElementById('pref-union').checked,
    marketing: document.getElementById('pref-mkt').checked,
    channel: document.getElementById('prefChannel').value
  };
  try { localStorage.setItem('bopeu_notif_prefs', JSON.stringify(prefs)); } catch(e){}
  alert('Preferences saved.');
}

render();
</script>
</body>
</html>
