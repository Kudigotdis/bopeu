<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Documents · BOPEU</title><link rel="stylesheet" href="design-system.css"></head>
<body class="bop">
<header style="background:#fff;border-bottom:1px solid #E2E8F0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;">
  <a href="profile.html" style="display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;">
    <div style="width:32px;height:32px;border-radius:8px;background:#D32F2F;color:#fff;display:grid;place-items:center;font-weight:800;">B</div>
    <div><div style="font-weight:800;font-size:14px;">BOPEU</div><div style="font-size:10px;color:#718096;">MEMBER SERVICES</div></div>
  </a>
  <a href="profile.html" style="font-size:13px;font-weight:700;color:#D32F2F;text-decoration:none;">← Profile</a>
</header>
<main class="page stack">
  <div class="card"><div class="card-head"><h2>Document Vault</h2><div class="card-sub">Official documents you've submitted to BOPEU. Files are stored securely and only accessible to you and authorised staff.</div></div>
    <div class="card-body">
      <div class="btn-row"><input type="file" id="docFile" style="display:none;" onchange="uploadDoc(event)"><button class="btn btn-primary" onclick="document.getElementById('docFile').click()">Upload document</button></div>
      <div id="docList" class="mt-md"></div>
    </div>
  </div>
  <div class="card"><div class="card-header"><h2>Official PDFs</h2></div><div class="card-body" id="pdfList"></div></div>
</main>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  renderDocs();
  document.getElementById('pdfList').innerHTML = (BOPEU_PDF_FORMS||[]).map(function(f){
    return '<a class="row" href="'+f.file+'" download><div class="row-icon">📄</div><div class="row-body"><div class="row-title">'+f.name+'</div><div class="row-desc">'+f.disc+'</div></div></a>';
  }).join('');
});
function uploadDoc(e){
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  var docs = LocalStore.get('bopeu_member_docs')||[];
  docs.unshift({ id:'DOC-'+Date.now(), name:file.name, size:file.size, at:new Date().toISOString() });
  LocalStore.set('bopeu_member_docs',docs);
  renderDocs();
  alert('Uploaded: '+file.name);
  e.target.value='';
}
function renderDocs(){
  var docs = LocalStore.get('bopeu_member_docs')||[];
  document.getElementById('docList').innerHTML = docs.length ? docs.map(function(d){
    return '<div class="checklist-item"><span class="chk-num">📎</span><span><strong>'+d.name+'</strong><br><span class="text-small text-muted">'+Math.round(d.size/1024)+' KB · '+new Date(d.at).toLocaleDateString()+'</span></span><button class="btn btn-secondary btn-small" style="margin-left:auto;" onclick="deleteDoc(\''+d.id+'\')">Delete</button></div>';
  }).join('') : '<div class="empty">No documents uploaded yet.</div>';
}
function deleteDoc(id){
  if (!confirm('Delete this document?')) return;
  var docs = (LocalStore.get('bopeu_member_docs')||[]).filter(function(d){return d.id!==id;});
  LocalStore.set('bopeu_member_docs',docs);
  renderDocs();
}
</script>
</body></html>
