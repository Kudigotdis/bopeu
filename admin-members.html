<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Members · BOPEU Admin</title>
<link rel="stylesheet" href="design-system.css">
<style>
  body.bop { background:#F2F5F9; }
  .admin-header { background:#1A202C; color:#fff; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:20; }
  .admin-brand { display:flex; align-items:center; gap:10px; }
  .admin-mark { width:32px; height:32px; border-radius:8px; background:#D32F2F; display:grid; place-items:center; font-weight:800; color:#fff; }
  .admin-nav { display:flex; gap:16px; font-size:13px; }
  .admin-nav a { color:#fff; text-decoration:none; font-weight:600; opacity:.85; }
  .admin-layout { display:grid; grid-template-columns:220px 1fr; min-height:calc(100vh - 56px); }
  .admin-side { background:#fff; border-right:1px solid #E2E8F0; padding:16px 12px; }
  .admin-side a { display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:8px; font-size:13px; font-weight:600; color:#4A5568; text-decoration:none; margin-bottom:2px; }
  .admin-side a.active { background:#FFEBEE; color:#D32F2F; }
  .admin-main { padding:24px; max-width:1200px; }
  .filter-bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .filter-bar input, .filter-bar select { flex:1 1 200px; padding:10px 12px; border:1px solid #E2E8F0; border-radius:10px; font-family:inherit; font-size:14px; background:#fff; }
  @media (max-width:820px) { .admin-layout { grid-template-columns:1fr; } .admin-side { display:none; } }
</style>
</head>
<body class="bop">

<header class="admin-header">
  <div class="admin-brand">
    <div class="admin-mark">B</div>
    <div><div style="font-weight:800; font-size:14px;">BOPEU Admin</div><div style="font-size:10px; opacity:.7;">Staff Portal</div></div>
  </div>
  <nav class="admin-nav">
    <a href="admin-dashboard.html">Dashboard</a>
    <a href="admin-submissions.html">Submissions</a>
    <a href="admin-members.html" style="text-decoration:underline;">Members</a>
    <a href="admin-content.html">Content</a>
    <a href="admin-reports.html">Reports</a>
    <a href="admin-login.html">Sign out</a>
  </nav>
</header>

<div class="admin-layout">
  <aside class="admin-side">
    <a href="admin-dashboard.html">📊 Dashboard</a>
    <a href="admin-submissions.html">📥 Submissions</a>
    <a href="admin-members.html" class="active">👥 Members</a>
    <a href="admin-content.html">📰 Content</a>
    <a href="admin-users-roles.html">🔐 Users &amp; Roles</a>
    <a href="admin-audit-log.html">📜 Audit Log</a>
    <a href="admin-reports.html">📈 Reports</a>
  </aside>

  <main class="admin-main">
    <h1 style="font-size:22px; font-weight:800; margin-bottom:4px;">Members</h1>
    <p style="color:#718096; font-size:14px; margin-bottom:20px;">Search and review BOPEU members.</p>

    <div class="filter-bar">
      <input type="text" id="adminSearch" placeholder="Search by name, Omang, member no., employer…" oninput="renderAdminMembers()">
      <select id="adminSector" onchange="renderAdminMembers()">
        <option value="">All sectors</option>
        <option value="central_gov">Central Government</option>
        <option value="local_council">Local Authority</option>
        <option value="land_board">Land Board</option>
        <option value="parastatal">Parastatal</option>
      </select>
      <select id="adminStatus" onchange="renderAdminMembers()">
        <option value="">All statuses</option>
        <option value="active">Active</option>
        <option value="pending_verification">Pending verification</option>
      </select>
    </div>

    <div id="adminMembersList"></div>
  </main>
</div>

<div class="modal" id="admin-modal" style="position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(15,23,32,.55);">
  <div style="width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:#fff;border-radius:16px;padding:20px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #E2E8F0;">
      <h2 style="font-size:18px;font-weight:800;margin:0;" id="adminModalTitle">Admin</h2>
      <button style="background:none;border:none;font-size:24px;cursor:pointer;color:#718096;" onclick="closeModal('admin-modal')">&times;</button>
    </div>
    <div id="adminModalBody"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/demo-profiles.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
<script>
  // Enhance member cards to be clickable into detail page.
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof renderAdminMembers === 'function') renderAdminMembers();

    // Delegate clicks on generated member cards to open detail by Omang.
    var list = document.getElementById('adminMembersList');
    list.addEventListener('click', function (e) {
      var card = e.target.closest('.member-card, .row');
      if (!card) return;
      // Find member no. in the card text and match against mock data.
      var text = card.textContent || '';
      var match = BOPEU_MOCK_MEMBERS.find(function (m) { return text.indexOf(m.memberNo) !== -1; });
      if (match) location.href = 'admin-member-detail.html?omang=' + encodeURIComponent(match.omang);
    });
  });
</script>
</body>
</html>
