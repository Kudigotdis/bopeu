<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Staff · BOPEU Admin</title><link rel="stylesheet" href="design-system.css">
<style>
body.bop{background:#F2F5F9}
.admin-header{background:#1A202C;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;bottom:0;z-index:20}
.admin-mark{width:32px;height:32px;border-radius:8px;background:#D32F2F;display:grid;place-items:center;font-weight:800;color:#fff}
.admin-nav{display:flex;gap:16px;font-size:13px}
.admin-nav a{color:#fff;text-decoration:none;font-weight:600;opacity:.85}
.admin-layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 56px)}
.admin-side{background:#fff;border-right:1px solid #E2E8F0;padding:16px 12px}
.admin-side a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;color:#4A5568;text-decoration:none;margin-bottom:2px}
.admin-side a.active{background:#FFEBEE;color:#D32F2F}
.admin-main{padding:24px;max-width:1100px}
.admin-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
.admin-table th{background:#F7F9FC;text-align:left;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#718096;padding:12px;border-bottom:1px solid #E2E8F0}
.admin-table td{padding:12px;border-bottom:1px solid #E2E8F0;font-size:14px;color:#1A202C}
@media(max-width:820px){.admin-layout{grid-template-columns:1fr}.admin-side{display:none}}
</style></head>
<body data-page-id="Page-admin-staff" class="bop">
<div class="admin-layout">
  <aside class="admin-side">
    <a href="admin-dashboard.html">📊 Dashboard</a>
    <a href="admin-staff.html" class="active">👔 Staff</a>
    <a href="admin-users-roles.html">🔐 Users &amp; Roles</a>
    <a href="admin-partners.html">🤝 Partners</a>
    <a href="admin-approvals.html">✅ Approvals</a>
    <a href="admin-data-requests.html">📋 Data Requests</a>
    <a href="admin-feedback.html">💬 Feedback</a>
  </aside>
  <main class="admin-main">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <div><h1 style="font-size:22px;font-weight:800;margin:0;">Staff</h1><p style="color:#718096;font-size:14px;margin:4px 0 0;">All BOPEU staff with admin portal access.</p></div>
      <button class="btn btn-primary" onclick="location.href='admin-staff-detail.html'">+ New staff</button>
    </div>
    <table class="admin-table"><thead><tr><th>Name</th><th>Email</th><th>Department</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody id="staffList"></tbody></table>
  </main>
</div>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script src="js/demo-profiles.js"></script>
<script src="js/auth.js"></script>
<script>
var DEMO_STAFF = [
  {id:'S-1',name:'Kabelo Modise',email:'k.modise@bopeu.org.bw',department:'ICT',role:'Super admin',status:'active'},
  {id:'S-2',name:'Naledi Sekgoma',email:'n.sekgoma@bopeu.org.bw',department:'Membership',role:'Processing',status:'active'},
  {id:'S-3',name:'Tshepo Molefe',email:'t.molefe@bopeu.org.bw',department:'Marketing',role:'Marketing',status:'active'},
  {id:'S-4',name:'Ruth Mogwe',email:'r.mogwe@bopeu.org.bw',department:'Management',role:'Management',status:'active'},
  {id:'S-5',name:'Patrick Ketlhoilwe',email:'p.ketlhoilwe@bopeu.org.bw',department:'Compliance',role:'Auditor',status:'inactive'}
];
document.addEventListener('DOMContentLoaded', function(){
  var custom = LocalStore.get('bopeu_staff')||[];
  var rows = custom.concat(DEMO_STAFF);
  document.getElementById('staffList').innerHTML = rows.map(function(s){
    var cls = s.status==='active'?'badge-green':'badge-grey';
    return '<tr><td><strong>'+s.name+'</strong></td><td>'+s.email+'</td><td>'+s.department+'</td><td>'+s.role+'</td><td><span class="badge '+cls+'">'+s.status+'</span></td><td><a href="admin-staff-detail.html?id='+s.id+'" style="font-weight:700;color:#D32F2F;text-decoration:none;">Edit →</a></td></tr>';
  }).join('');
});
</script>

<header class="admin-header">
  <div style="display:flex;align-items:center;gap:10px;"><div class="admin-mark">B</div><div><div style="font-weight:800;font-size:14px;">BOPEU Admin</div><div style="font-size:10px;opacity:.7;">Staff Portal</div></div></div>
  <nav class="admin-nav"><a href="admin-dashboard.html">Dashboard</a><a href="admin-staff.html" style="text-decoration:underline;">Staff</a><a href="admin-login.html">Sign out</a></nav>
</header>
</body></html>
