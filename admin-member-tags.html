<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Member Tags · BOPEU Admin</title>
<link rel="stylesheet" href="design-system.css">
<style>body.bop{background:#F2F5F9}.admin-header{background:#1A202C;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;bottom:0;z-index:20}.admin-layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 118px)}.admin-side{background:#fff;border-right:1px solid #E2E8F0;padding:16px 12px}.admin-side a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;color:#4A5568;text-decoration:none;margin-bottom:2px}.admin-side a.active{background:#FFEBEE;color:#D32F2F}.admin-main{padding:24px;max-width:1000px}.tag-card{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}</style>
</head>
<body data-page-id="Page-admin-member-tags" class="bop">

<div class="app-header">
    <img src="Assets/logo/bopeu_logo.webp" alt="BOPEU" class="app-logo" data-logo-key="bopeu">
    <button type="button" id="loginToggleBtn" class="btn header-login-btn btn-secondary" onclick="handleLoginToggle()">Logout</button>
</div>

<div class="admin-layout">
  <aside class="admin-side">
    <a href="admin-sales-pipeline.html">🎯 Pipeline</a>
    <a href="admin-members.html">👥 Members</a>
    <a href="admin-member-tags.html" class="active">🏷️ Tags</a>
  </aside>
  <main class="admin-main">
    <h1 style="font-size:22px;font-weight:800;margin-bottom:4px;">Member Tags</h1>
    <p style="color:#718096;font-size:14px;margin-bottom:20px;">Segment members for targeted campaigns and reporting</p>
    <div style="text-align:right;margin-bottom:16px;"><button class="btn btn-primary" onclick="newTag()">+ New tag</button></div>
    <div id="tagList"></div>
  </main>
</div>
<script>
var TAGS = [
  { id:1, name:'Shop Stewards', count:14, color:'#FFEBEE', text:'#B71C1C' },
  { id:2, name:'Long-serving (10+ years)', count:2841, color:'#E8F5E9', text:'#2E7D32' },
  { id:3, name:'New members (< 6 months)', count:187, color:'#E3F2FD', text:'#0D47A1' },
  { id:4, name:'High-value savers', count:412, color:'#FFF3E0', text:'#E65100' },
  { id:5, name:'Bursary recipients', count:1847, color:'#F3E5F5', text:'#6A1B9A' },
  { id:6, name:'Pending payroll verification', count:23, color:'#FFF8E1', text:'#8A6D1B' },
  { id:7, name:'No mobile wallet linked', count:18492, color:'#F7F9FC', text:'#718096' },
  { id:8, name:'Retired members', count:284, color:'#ECEFF1', text:'#455A64' }
];
function render() {
  document.getElementById('tagList').innerHTML = TAGS.map(t => '<div class="tag-card"><div><div style="display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:800;background:' + t.color + ';color:' + t.text + ';">' + t.name + '</div><div style="font-size:12px;color:#718096;margin-top:6px;">' + t.count.toLocaleString() + ' members</div></div><div style="display:flex;gap:8px;"><button class="btn btn-secondary btn-small">Edit</button><button class="btn btn-secondary btn-small">Send campaign</button></div></div>').join('');
}
function newTag() {
  var name = prompt('Tag name:');
  if (!name) return;
  TAGS.push({ id: Date.now(), name, count: 0, color:'#E3F2FD', text:'#0D47A1' });
  render();
}
render();
</script>

<script src="js/demo-profiles.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
