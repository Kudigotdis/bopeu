<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Edit Notice · BOPEU Admin</title><link rel="stylesheet" href="design-system.css">
<style>
body.bop{background:#F2F5F9}
.admin-header{background:#1A202C;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.admin-mark{width:32px;height:32px;border-radius:8px;background:#D32F2F;display:grid;place-items:center;font-weight:800;color:#fff}
.admin-nav{display:flex;gap:16px;font-size:13px}
.admin-nav a{color:#fff;text-decoration:none;font-weight:600;opacity:.85}
.admin-layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 56px)}
.admin-side{background:#fff;border-right:1px solid #E2E8F0;padding:16px 12px}
.admin-side a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;color:#4A5568;text-decoration:none;margin-bottom:2px}
.admin-side a.active{background:#FFEBEE;color:#D32F2F}
.admin-main{padding:24px;max-width:900px}
@media(max-width:820px){.admin-layout{grid-template-columns:1fr}.admin-side{display:none}}
</style></head>
<body data-page-id="Page-admin-notice-edit" class="bop">
<header class="admin-header">
  <div style="display:flex;align-items:center;gap:10px;"><div class="admin-mark">B</div><div><div style="font-weight:800;font-size:14px;">BOPEU Admin</div><div style="font-size:10px;opacity:.7;">Staff Portal</div></div></div>
  <nav class="admin-nav"><a href="admin-noticeboards.html">Notices</a><a href="admin-login.html">Sign out</a></nav>
</header>
<div class="admin-layout">
  <aside class="admin-side">
    <a href="admin-dashboard.html">📊 Dashboard</a>
    <a href="admin-promotions.html">📣 Promotions</a>
    <a href="admin-noticeboards.html" class="active">📌 Notice Boards</a>
  </aside>
  <main class="admin-main">
    <a href="admin-noticeboards.html" style="font-size:13px;font-weight:700;color:#D32F2F;text-decoration:none;">← Notices</a>
    <h1 style="font-size:22px;font-weight:800;margin:8px 0 20px;">Edit Notice</h1>
    <div class="card"><div class="card-body">
      <div class="form-group"><label class="form-label">Title</label><input type="text" id="nT"></div>
      <div class="form-group"><label class="form-label">Body</label><textarea id="nBody" rows="4" style="width:100%;padding:10px;border:1px solid #E2E8F0;border-radius:10px;font-family:inherit;font-size:14px;"></textarea></div>
      <div class="form-group"><label class="form-label">Category</label><select id="nCat"><option>General</option><option>Update</option><option>Urgent</option><option>Event</option></select></div>
      <div class="form-group"><label class="form-label">Publish date</label><input type="date" id="nDate"></div>
      <div class="form-group"><label class="form-label">Expiry date (optional)</label><input type="date" id="nEnd"></div>
      <div class="checklist-item"><input type="checkbox" id="nPin"><label for="nPin">Pin to top of notice board</label></div>
      <div class="btn-row mt-md"><a class="btn btn-secondary" href="admin-noticeboards.html">Cancel</a><button class="btn btn-primary" onclick="saveNotice()">Save</button></div>
    </div></div>
  </main>
</div>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script src="js/demo-profiles.js"></script>
<script src="js/auth.js"></script>
<script>
function saveNotice(){
  var n = { id:'N-'+Date.now(), title:document.getElementById('nT').value, body:document.getElementById('nBody').value, category:document.getElementById('nCat').value, date:document.getElementById('nDate').value||new Date().toISOString().slice(0,10), end:document.getElementById('nEnd').value, pinned:document.getElementById('nPin').checked, status:'published' };
  if (!n.title){ alert('Title required.'); return; }
  var list = LocalStore.get('bopeu_admin_notices')||[]; list.unshift(n); LocalStore.set('bopeu_admin_notices',list);
  alert('Notice saved.'); location.href='admin-noticeboards.html';
}
</script>
</body></html>
