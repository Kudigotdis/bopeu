<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sales Pipeline · BOPEU Admin</title><link rel="stylesheet" href="design-system.css">
<style>
body.bop{background:#F2F5F9}
.admin-header{background:#1A202C;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;bottom:0;z-index:20}
.admin-mark{width:32px;height:32px;border-radius:8px;background:#D32F2F;display:grid;place-items:center;font-weight:800;color:#fff}
.admin-nav{display:flex;gap:16px;font-size:13px}
.admin-nav a{color:#fff;text-decoration:none;font-weight:600;opacity:.85}
.admin-layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 56px)}
.admin-side{background:#fff;border-right:1px solid #E2E8F0;padding:16px 12px}
.admin-side a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;color:#4A5568;text-decoration:none;margin-bottom:2px}
.admin-side a.active{background:#FFEBEE;color:#D32F2F}
.admin-main{padding:24px;max-width:1200px}
.pipeline{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:12px}
.stage{background:#fff;border-radius:12px;border:1px solid #E2E8F0;padding:12px;min-height:300px}
.stage h3{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#718096;margin:0 0 10px}
.lead-card{background:#F7F9FC;border:1px solid #E2E8F0;border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer;font-size:13px}
.lead-card:hover{background:#FAFBFD;border-color:#D32F2F}
.lead-card strong{display:block;font-weight:800;color:#1A202C;margin-bottom:2px}
.lead-card small{color:#718096}
@media(max-width:820px){.admin-layout{grid-template-columns:1fr}.admin-side{display:none}}
</style></head>
<body data-page-id="Page-admin-sales-pipeline" class="bop">
<div class="admin-layout">
  <aside class="admin-side">
    <a href="admin-dashboard.html">📊 Dashboard</a>
    <a href="admin-submissions.html">📥 Submissions</a>
    <a href="admin-sales-pipeline.html" class="active">🎯 Sales</a>
    <a href="admin-members.html">👥 Members</a>
    <a href="admin-promotions.html">📣 Marketing</a>
    <a href="admin-staff.html">👔 Staff</a>
    <a href="admin-partners.html">🤝 Partners</a>
    <a href="admin-approvals.html">✅ Approvals</a>
    <a href="admin-reports.html">📈 Reports</a>
  </aside>
  <main class="admin-main">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <div><h1 style="font-size:22px;font-weight:800;margin:0;">Sales Pipeline</h1><p style="color:#718096;font-size:14px;margin:4px 0 0;">Prospect leads by stage. Click a card to open details.</p></div>
      <button class="btn btn-primary" onclick="newLead()">+ New lead</button>
    </div>
    <div class="pipeline" id="pipeline"></div>
  </main>
</div>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script src="js/demo-profiles.js"></script>
<script src="js/auth.js"></script>
<script>
var STAGES = ['New','Contacted','Qualifying','Application','Converted'];
var DEMO_LEADS = [
  {id:'L-1001',name:'Thabo Sekgoma',phone:'+267 71 000 001',source:'Walk-in',stage:'New',owner:'N. Sekgoma',employer:'Ministry of Health'},
  {id:'L-1002',name:'Boitumelo Radipitse',phone:'+267 71 000 002',source:'Referral',stage:'Contacted',owner:'T. Molefe',employer:'Gaborone City Council'},
  {id:'L-1003',name:'Mpho Moyo',phone:'+267 71 000 003',source:'Facebook',stage:'Qualifying',owner:'N. Sekgoma',employer:'BPC'},
  {id:'L-1004',name:'Kabo Mabutho',phone:'+267 71 000 004',source:'Event',stage:'Application',owner:'T. Molefe',employer:'Ministry of Agriculture'},
  {id:'L-1005',name:'Lesego Kgosiemang',phone:'+267 71 000 005',source:'Referral',stage:'Converted',owner:'N. Sekgoma',employer:'Land Board'}
];
function getLeads(){ return LocalStore.get('bopeu_leads') || DEMO_LEADS; }
function renderPipeline(){
  var leads = getLeads();
  document.getElementById('pipeline').innerHTML = STAGES.map(function(s){
    var cards = leads.filter(function(l){return l.stage===s;}).map(function(l){
      return '<div class="lead-card" onclick="location.href=\'admin-lead-detail.html?id='+l.id+'\'"><strong>'+l.name+'</strong><small>'+l.employer+' · '+l.owner+'</small></div>';
    }).join('');
    return '<div class="stage"><h3>'+s+' ('+leads.filter(function(l){return l.stage===s;}).length+')</h3>'+(cards||'<div style="font-size:12px;color:#718096;">No leads</div>')+'</div>';
  }).join('');
}
function newLead(){
  var name = prompt('Lead name:'); if(!name) return;
  var leads = getLeads(); leads.push({id:'L-'+Date.now(),name:name,phone:'',source:'Manual',stage:'New',owner:'Unassigned',employer:''});
  LocalStore.set('bopeu_leads',leads); renderPipeline();
}
document.addEventListener('DOMContentLoaded', renderPipeline);
</script>

<header class="admin-header">
  <div style="display:flex;align-items:center;gap:10px;"><div class="admin-mark">B</div><div><div style="font-weight:800;font-size:14px;">BOPEU Admin</div><div style="font-size:10px;opacity:.7;">Staff Portal</div></div></div>
  <nav class="admin-nav"><a href="admin-dashboard.html">Dashboard</a><a href="admin-sales-pipeline.html" style="text-decoration:underline;">Sales</a><a href="admin-members.html">Members</a><a href="admin-login.html">Sign out</a></nav>
</header>
</body></html>
