<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Download Center · BOPEU</title>
<link rel="stylesheet" href="design-system.css">
</head>
<body data-page-id="Page-download-center" class="bop">
<header style="background:#fff;border-bottom:1px solid #E2E8F0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;">
  <a href="help-tab.html" style="display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;">
    <div style="width:32px;height:32px;border-radius:8px;background:#D32F2F;color:#fff;display:grid;place-items:center;font-weight:800;">B</div>
    <div><div style="font-weight:800;font-size:14px;">BOPEU</div><div style="font-size:10px;color:#718096;">DOWNLOADS</div></div>
  </a>
  <a href="help-tab.html" style="font-size:13px;font-weight:700;color:#D32F2F;text-decoration:none;">← Help</a>
</header>
<main class="page stack">

  <div class="card">
    <div class="card-header"><h2>Application forms</h2></div>
    <div class="card-body" id="appForms"></div>
  </div>

  <div class="card">
    <div class="card-header"><h2>Policy documents</h2></div>
    <div class="card-body" id="policyDocs"></div>
  </div>

  <div class="card">
    <div class="card-header"><h2>BOPEU constitution & governance</h2></div>
    <div class="card-body" id="governanceDocs"></div>
  </div>

  <div class="card">
    <div class="card-header"><h2>Newsletters & publications</h2></div>
    <div class="card-body" id="newsDocs"></div>
  </div>

</main>
<script>
var DOCS = {
  appForms: [
    { title:'Membership Application', file:'docs/PDFs/BOPEU_BABEREKI_MEMBERSHIP  APPLICATION FORM.pdf', desc:'Join BOPEU — primary form' },
    { title:'Extended Family Application', file:'docs/PDFs/BOPEU_BABEREKI_EXTENDED FAMILY APPLICATION FORM.pdf', desc:'Add extended family to funeral cover' },
    { title:'Funeral Cover Amendment', file:'docs/PDFs/BOPEU_BABEREKI_AMMENDMENT FORM.pdf', desc:'Change current funeral cover' },
    { title:'KYC — Know Your Customer', file:'docs/PDFs/BOPEU_BLIC-KNOW YOUR CUSTOMER.pdf', desc:'Identity verification form' },
    { title:'Group Life Nomination of Beneficiaries', file:'docs/PDFs/BOPEU_BLIC-APPLICATION - GROUP LIFE ASSURANCE NOMINATION OF BENEFICIARIES.pdf', desc:'Nominate who receives Group Life benefit' }
  ],
  policyDocs: [
    { title:'Extended Family — Bona Life', file:'docs/PDFs/BOPEU_FAMILY - EXTENDED FAMILY.pdf', desc:'Extended family cover terms' }
  ],
  governanceDocs: [
    { title:'BOPEU Constitution', file:'docs/PDFs/BOPEU_Constitution.pdf', desc:'Current constitution (2024 revision)' }
  ],
  newsDocs: [
    { title:'BOPEU Newsletter Q3 2026', file:'docs/PDFs/BOPEU_Newsletter_Q3_2026.pdf', desc:'Quarterly newsletter' }
  ]
};

function renderSection(id, docs) {
  var el = document.getElementById(id);
  if (!docs.length) { el.innerHTML = '<div class="empty">No documents in this section yet.</div>'; return; }
  var html = '';
  docs.forEach(d => {
    html += '<a class="row" href="' + d.file + '" download>' +
      '<div class="row-icon">📄</div>' +
      '<div class="row-body"><div class="row-title">' + d.title + '</div><div class="row-desc">' + d.desc + '</div></div>' +
      '<div class="row-tail" style="color:#D32F2F;font-weight:800;font-size:13px;">PDF ↓</div>' +
      '</a>';
  });
  el.innerHTML = html;
}

Object.keys(DOCS).forEach(k => renderSection(k, DOCS[k]));
</script>
</body>
</html>
