<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Analytics · BOPEU Partner</title><link rel="stylesheet" href="design-system.css">
<style>
body.bop{background:#F2F5F9}
.p-header{background:#0F7A4D;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.p-mark{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:800;color:#fff}
.p-nav{display:flex;gap:16px;font-size:13px}
.p-nav a{color:#fff;text-decoration:none;font-weight:600;opacity:.85}
.p-layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 56px)}
.p-side{background:#fff;border-right:1px solid #E2E8F0;padding:16px 12px}
.p-side a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;color:#4A5568;text-decoration:none;margin-bottom:2px}
.p-side a.active{background:#E7F4EC;color:#0F7A4D}
.p-main{padding:24px;max-width:1100px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:16px}
.kpi .lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#718096}
.kpi .val{font-size:26px;font-weight:800;color:#1A202C;margin-top:6px;line-height:1}
@media(max-width:820px){.p-layout{grid-template-columns:1fr}.p-side{display:none}}
</style></head>
<body data-page-id="Page-partner-analytics" class="bop">
<header class="p-header">
  <div style="display:flex;align-items:center;gap:10px;"><div class="p-mark">P</div><div><div style="font-weight:800;font-size:14px;">BOPEU Partner</div><div style="font-size:10px;opacity:.8;">Benefit Partner Portal</div></div></div>
  <nav class="p-nav"><a href="partner-dashboard.html">Dashboard</a><a href="partner-login.html">Sign out</a></nav>
</header>
<div class="p-layout">
  <aside class="p-side">
    <a href="partner-dashboard.html">📊 Dashboard</a>
    <a href="partner-analytics.html" class="active">📈 Analytics</a>
    <a href="partner-feedback.html">💬 Feedback</a>
  </aside>
  <main class="p-main">
    <h1 style="font-size:22px;font-weight:800;margin:0 0 4px;">Analytics</h1>
    <p style="color:#718096;font-size:14px;margin:0 0 20px;">Aggregated member interaction data only. No member PII is exposed.</p>
    <div class="kpi-grid" id="aKpi"></div>
    <div class="card"><div class="card-header"><h2>Trend</h2></div><div class="card-body"><div class="empty">Charts available once event tracking is enabled and 30+ events are captured.</div></div></div>
  </main>
</div>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script src="js/demo-profiles.js"></script>
<script src="js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('aKpi').innerHTML = '<div class="kpi"><div class="lbl">Impressions (30d)</div><div class="val">0</div></div><div class="kpi"><div class="lbl">Views (30d)</div><div class="val">0</div></div><div class="kpi"><div class="lbl">Clicks (30d)</div><div class="val">0</div></div><div class="kpi"><div class="lbl">Redemptions (30d)</div><div class="val">0</div></div>';
});
</script>
</body></html>
