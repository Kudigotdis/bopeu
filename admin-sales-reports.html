<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sales Reports · BOPEU Admin</title><link rel="stylesheet" href="design-system.css">
<style>
body.bop{background:#F2F5F9}
.admin-header{background:#1A202C;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;bottom:0;z-index:20}
.admin-mark{width:32px;height:32px;border-radius:8px;background:#D32F2F;display:grid;place-items:center;font-weight:800;color:#fff}
.admin-nav{display:flex;gap:16px;font-size:13px}
.admin-nav a{color:#fff;text-decoration:none;font-weight:600;opacity:.85}
.admin-layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 56px)}
.admin-side{background:#fff;border-right:1px solid #E2E8F0;padding:16px 12px}
.admin-side a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;color:#4A5568;text-decoration:none;margin-bottom:2px}
.admin-side a.active{background:#FFEBEE;color:#D32F2F}
.admin-main{padding:24px;max-width:1100px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:16px}
.kpi .lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#718096}
.kpi .val{font-size:26px;font-weight:800;color:#1A202C;margin-top:6px;line-height:1}
@media(max-width:820px){.admin-layout{grid-template-columns:1fr}.admin-side{display:none}}
</style></head>
<body data-page-id="Page-admin-sales-reports" class="bop">
<div class="admin-layout">
  <aside class="admin-side">
    <a href="admin-dashboard.html">📊 Dashboard</a>
    <a href="admin-sales-pipeline.html" class="active">🎯 Sales</a>
    <a href="admin-members.html">👥 Members</a>
    <a href="admin-reports.html">📈 Reports</a>
  </aside>
  <main class="admin-main">
    <h1 style="font-size:22px;font-weight:800;margin:0 0 4px;">Sales Reports</h1>
    <p style="color:#718096;font-size:14px;margin:0 0 20px;">Conversion performance by agent, source and stage.</p>
    <div class="kpi-grid" id="salesKpi"></div>
    <div class="card"><div class="card-header"><h2>Conversion by source</h2></div><div class="card-body" id="bySource"></div></div>
    <div class="card"><div class="card-header"><h2>Conversion by agent</h2></div><div class="card-body" id="byAgent"></div></div>
    <div class="card"><div class="card-header"><h2>Stale leads (no activity &gt; 7 days)</h2></div><div class="card-body" id="staleLeads"></div></div>
  </main>
</div>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script src="js/demo-profiles.js"></script>
<script src="js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var leads = LocalStore.get('bopeu_leads') || [];
  var total = leads.length;
  var converted = leads.filter(function(l){return l.stage==='Converted';}).length;
  document.getElementById('salesKpi').innerHTML =
    '<div class="kpi"><div class="lbl">Total leads</div><div class="val">'+total+'</div></div>' +
    '<div class="kpi"><div class="lbl">Converted</div><div class="val">'+converted+'</div></div>' +
    '<div class="kpi"><div class="lbl">Conversion rate</div><div class="val">'+(total?Math.round(converted/total*100):0)+'%</div></div>';
  function groupBy(key){
    var out = {};
    leads.forEach(function(l){ var k=l[key]||'Unknown'; if(!out[k]) out[k]={total:0,converted:0}; out[k].total++; if(l.stage==='Converted') out[k].converted++; });
    return out;
  }
  function renderGroup(el, groups){
    el.innerHTML = Object.keys(groups).length ? '<table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr style="background:#F7F9FC;"><th style="text-align:left;padding:8px;font-size:11px;text-transform:uppercase;color:#718096;">Group</th><th style="text-align:right;padding:8px;font-size:11px;text-transform:uppercase;color:#718096;">Total</th><th style="text-align:right;padding:8px;font-size:11px;text-transform:uppercase;color:#718096;">Converted</th></tr></thead><tbody>'+Object.keys(groups).map(function(k){return '<tr><td style="padding:8px;border-top:1px solid #E2E8F0;">'+k+'</td><td style="padding:8px;border-top:1px solid #E2E8F0;text-align:right;">'+groups[k].total+'</td><td style="padding:8px;border-top:1px solid #E2E8F0;text-align:right;">'+groups[k].converted+'</td></tr>';}).join('')+'</tbody></table>' : '<div class="empty">No data yet.</div>';
  }
  renderGroup(document.getElementById('bySource'), groupBy('source'));
  renderGroup(document.getElementById('byAgent'), groupBy('owner'));
  document.getElementById('staleLeads').innerHTML = '<div class="empty">Stale-lead detection requires activity timestamps. Coming with full interaction log.</div>';
});
</script>

<header class="admin-header">
  <div style="display:flex;align-items:center;gap:10px;"><div class="admin-mark">B</div><div><div style="font-weight:800;font-size:14px;">BOPEU Admin</div><div style="font-size:10px;opacity:.7;">Staff Portal</div></div></div>
  <nav class="admin-nav"><a href="admin-sales-pipeline.html">Sales</a><a href="admin-members.html">Members</a><a href="admin-login.html">Sign out</a></nav>
</header>
</body></html>
