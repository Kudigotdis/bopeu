<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Password · BOPEU</title>
<link rel="stylesheet" href="design-system.css">
<link rel="stylesheet" href="css/auth.css">
<style>
  body.bop { background:#F7F9FC; }
  .auth-wrap { min-height:100vh; display:grid; place-items:center; padding:20px; }
  .auth-card { width:100%; max-width:420px; background:#fff; border-radius:16px; padding:32px; box-shadow:0 10px 30px rgba(0,0,0,.08); border:1px solid #E2E8F0; }
  .auth-mark { width:52px; height:52px; border-radius:14px; background:#D32F2F; color:#fff; display:grid; place-items:center; font-weight:800; font-size:22px; margin:0 auto 16px; }
  .reset-step { display:none; }
  .reset-step.active { display:block; }
  .reset-title { font-size:20px; font-weight:800; text-align:center; margin:0 0 6px; }
  .reset-sub { font-size:13px; color:#718096; text-align:center; margin:0 0 22px; line-height:1.45; }
  .reset-error { display:none; margin-bottom:12px; padding:10px 12px; border:1px solid #F3C3C8; border-radius:9px; background:#FFF5F5; color:#B42318; font-size:12.5px; }
  .reset-error.show { display:block; }
  .reset-done { text-align:center; padding:8px 0; }
  .reset-done .tick { font-size:54px; margin-bottom:10px; }
</style>
</head>
<body data-page-id="Page-forgot-password" class="bop">
<main class="auth-wrap">
  <div class="auth-card">
    <div class="auth-mark">B</div>

    <section class="reset-step active" id="resetStep1">
      <h1 class="reset-title">Reset your password</h1>
      <p class="reset-sub">Enter the WhatsApp number and first name on your BOPEU profile.</p>
      <div class="reset-error" id="resetError" role="alert"></div>
      <div class="form-group">
        <label class="form-label">WhatsApp Number</label>
        <input type="tel" id="resetWhatsapp" autocomplete="tel" placeholder="e.g. 71 000 101">
      </div>
      <div class="form-group">
        <label class="form-label">First Name</label>
        <input type="text" id="resetFirstName" autocomplete="given-name" placeholder="e.g. Jackson">
      </div>
      <button class="btn btn-primary btn-block" onclick="resetFindIdentity()">Continue</button>
      <p style="text-align:center;font-size:13px;margin-top:18px;"><a href="login.html" style="color:#D32F2F;font-weight:700;text-decoration:none;">← Back to sign in</a></p>
    </section>

    <section class="reset-step" id="resetStep2">
      <h1 class="reset-title">Choose a new password</h1>
      <p class="reset-sub" id="resetIdentityLabel">Use at least 4 characters for this demo.</p>
      <div class="reset-error" id="resetError2" role="alert"></div>
      <div class="form-group">
        <label class="form-label">New password</label>
        <input type="password" id="resetNewPassword" autocomplete="new-password" placeholder="New password">
      </div>
      <div class="form-group">
        <label class="form-label">Confirm new password</label>
        <input type="password" id="resetConfirmPassword" autocomplete="new-password" placeholder="Repeat new password">
      </div>
      <button class="btn btn-primary btn-block" onclick="resetSavePassword()">Save new password</button>
      <p style="text-align:center;font-size:13px;margin-top:18px;"><button onclick="resetStartOver()" style="background:none;border:none;color:#718096;font-weight:700;cursor:pointer;">Start over</button></p>
    </section>

    <section class="reset-step" id="resetStep3">
      <div class="reset-done">
        <div class="tick">✅</div>
        <h1 class="reset-title">Password updated</h1>
        <p class="reset-sub">Sign in with your WhatsApp number, first name and new password.</p>
        <a href="login.html" class="btn btn-primary btn-block">Go to sign in</a>
      </div>
    </section>
  </div>
</main>

<script src="js/demo-profiles.js"></script>
<script src="js/auth.js"></script>
<script>
var resetProfile = null;

function showResetStep(n) {
  ['resetStep1', 'resetStep2', 'resetStep3'].forEach(function (id) {
    document.getElementById(id).classList.remove('active');
  });
  document.getElementById('resetStep' + n).classList.add('active');
}

function resetError(message, boxId) {
  var box = document.getElementById(boxId || 'resetError');
  box.textContent = message || '';
  box.classList.toggle('show', !!message);
}

function resetFindIdentity() {
  resetError('');
  var whatsapp = document.getElementById('resetWhatsapp').value.trim();
  var firstName = document.getElementById('resetFirstName').value.trim();
  if (!whatsapp || !firstName) {
    resetError('Enter your WhatsApp number and first name.');
    return;
  }
  if (!window.BOPEUAuth) {
    resetError('Password reset is still loading. Please try again.');
    return;
  }
  resetProfile = window.BOPEUAuth.findProfileByCredentials(whatsapp, firstName);
  if (!resetProfile) {
    resetError('No profile matches that WhatsApp number and first name.');
    return;
  }
  document.getElementById('resetIdentityLabel').textContent =
    'Resetting password for ' + resetProfile.displayName + '. Use at least 4 characters for this demo.';
  showResetStep(2);
}

function resetSavePassword() {
  resetError('', 'resetError2');
  var password = document.getElementById('resetNewPassword').value;
  var confirm = document.getElementById('resetConfirmPassword').value;
  if (!password || password.length < 4) {
    resetError('Use at least 4 characters.', 'resetError2');
    return;
  }
  if (password !== confirm) {
    resetError('The passwords do not match.', 'resetError2');
    return;
  }
  window.BOPEUAuth.setPassword(resetProfile.id, password);
  showResetStep(3);
}

function resetStartOver() {
  resetProfile = null;
  document.getElementById('resetNewPassword').value = '';
  document.getElementById('resetConfirmPassword').value = '';
  resetError('', 'resetError2');
  showResetStep(1);
}
</script>
</body>
</html>
