<!doctype html>
<html lang="en-BW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOPEU Notice Cards — Preview</title>
<style>
:root{--red:#c8102e;--dark:#8e1220;--ink:#1f2328;--muted:#5d6672;--line:#e2e5e9;--soft:#fff4f4;--paper:#f5f6f8;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:16px/1.58 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}header{background:var(--red);color:white;padding:24px 18px 28px}header .wrap,main{max-width:820px;margin:auto}header .eyebrow{font-size:.76rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;opacity:.9}h1{font-size:clamp(1.7rem,5vw,2.5rem);line-height:1.15;margin:.55rem 0}header p{margin:.4rem 0 0;max-width:650px}main{padding:18px 14px 48px}.note{font-size:.9rem;color:var(--muted);margin:0 2px 15px}.notice{background:white;border:1px solid var(--line);border-radius:16px;margin:15px 0;overflow:hidden;box-shadow:0 3px 14px #17212b0a}.head{padding:18px 18px 13px}.meta{font-size:.72rem;font-weight:800;letter-spacing:.08em;color:var(--red);text-transform:uppercase}.notice h2{font-size:1.23rem;line-height:1.3;margin:.45rem 0}.summary{font-weight:560;margin:0}.open{padding:0 18px 18px}.open details{border-top:1px solid var(--line);padding-top:13px}summary{cursor:pointer;color:var(--dark);font-weight:750;padding:6px 0}h3{font-size:1rem;margin:18px 0 5px}p{margin:7px 0}ul,ol{padding-left:1.35rem;margin:7px 0}li{margin:5px 0}.alert{padding:12px 13px;background:var(--soft);border-left:4px solid var(--red);border-radius:7px;margin:16px 0}.actions{background:#f7f8fa;padding:13px 14px;border-radius:9px;margin:14px 0}.actions strong{display:block;margin-bottom:5px}.btn{display:inline-block;margin-top:9px;border:1px solid var(--red);border-radius:9px;color:var(--red);font-weight:750;padding:9px 13px;text-decoration:none}.footer{padding:0 18px 16px;color:var(--muted);font-size:.76rem}.status{display:inline-block;font-size:.7rem;color:#744b00;background:#fff1ce;border-radius:20px;padding:3px 8px;margin:5px 0 0}@media(min-width:650px){main{padding:26px 18px 50px}.head{padding:20px 22px 14px}.open{padding:0 22px 22px}}
</style></head><body data-page-id="Page-docs/Notice Board Info/notice-cards-preview">
<header><div class="wrap"><div class="eyebrow">Botswana Public Employees Union</div><h1>Member notices</h1><p>Detailed information about lending, payroll deductions, health benefits and funeral claims.</p></div></header>
<main><p class="note">Preview uses local JSON data. Internal verification notes are shown below each notice for the app builder; hide them from ordinary member views.</p><div id="cards"></div></main>
<script>
fetch('bopeu-notice-cards.json').then(r=>{if(!r.ok)throw Error('Could not load JSON');return r.json()}).then(data=>{
 const root=document.getElementById('cards');
 const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 data.items.forEach(n=>{const sec=n.body.sections.map(s=>`<h3>${esc(s.heading)}</h3>${(s.paragraphs||[]).map(p=>`<p>${esc(p)}</p>`).join('')}${s.bullets?`<ul>${s.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`:''}`).join('');
 const acts=n.member_actions.map(a=>`<li>${esc(a)}</li>`).join('');const confirms=n.verification.must_confirm_before_publish.map(a=>`<li>${esc(a)}</li>`).join('');
 const source=n.verification.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a></li>`).join('');
 const card=document.createElement('article');card.className='notice';card.innerHTML=`<div class="head"><div class="meta">${esc(n.card_label)} · ${esc(n.category)}</div><h2>${esc(n.title)}</h2><p class="summary">${esc(n.summary)}</p><span class="status">Editor status: ${esc(n.verification.publication_status)}</span></div><div class="open"><details><summary>Open full notice</summary><p>${esc(n.body.intro)}</p>${sec}<div class="alert"><strong>Important</strong><p>${esc(n.body.important_notice)}</p></div><div class="actions"><strong>What members should do</strong><ol>${acts}</ol><strong>CTA: ${esc(n.cta.label)}</strong><p>${n.cta.enabled===false?esc(n.cta.disabled_reason||'CTA disabled pending verification'):''}</p></div><h3>Internal publishing checklist</h3><ul>${confirms}</ul><h3>Reference sources</h3><ul>${source}</ul></details></div><div class="footer">ID: ${esc(n.id)} · Last checked ${esc(n.verification.last_checked)}</div>`;root.appendChild(card);
 });
}).catch(e=>{document.getElementById('cards').innerHTML='<p>To preview, keep this HTML file beside bopeu-notice-cards.json and open it through a local web server. Some browsers block fetch() from file:// URLs.</p><pre>'+String(e)+'</pre>'});
</script></body></html>
