<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Feedback · BOPEU Admin</title><link rel="stylesheet" href="design-system.css">
<style>
body.bop{background:#F2F5F9}
.admin-header{background:#1A202C;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.admin-mark{width:32px;height:32px;border-radius:8px;background:#D32F2F;display:grid;place-items:center;font-weight:800;color:#fff}
.admin-nav{display:flex;gap:16px;font-size:13px}
.admin-nav a{color:#fff;text-decoration:none;font-weight:600;opacity:.85}
.admin-layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 56px)}
.admin-side{background:#fff;border-right:1px solid #E2E8F0;padding:16px 12px}
.admin-side a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;color:#4A5568;text-decoration:none;margin-bottom:2px}
.admin-side a.active{background:#FFEBEE;color:#D32F2F}
.admin-main{padding:24px;max-width:1100px}
@media(max-width:820px){.admin-layout{grid-template-columns:1fr}.admin-side{display:none}}
</style></head>
<body class="bop">
<header class="admin-header">
  <div style="display:flex;align-items:center;gap:10px;"><div class="admin-mark">B</div><div><div style="font-weight:800;font-size:14px;">BOPEU Admin</div><div style="font-size:10px;opacity:.7;">Staff Portal</div></div></div>
  <nav class="admin-nav"><a href="admin-dashboard.html">Dashboard</a><a href="admin-feedback.html" style="text-decoration:underline;">Feedback</a><a href="admin-login.html">Sign out</a></nav>
</header>
<div class="admin-layout">
  <aside class="admin-side">
    <a href="admin-dashboard.html">📊 Dashboard</a>
    <a href="admin-feedback.html" class="active">💬 Feedback</a>
    <a href="admin-reports.html">📈 Reports</a>
  </aside>
  <main class="admin-main">
    <h1 style="font-size:22px;font-weight:800;margin:0 0 4px;">Member Feedback</h1>
    <p style="color:#718096;font-size:14px;margin:0 0 20px;">Moderation and aggregated view of feedback submitted by members.</p>
    <div class="row-list" id="fbList"></div>
  </main>
</div>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script src="js/demo-profiles.js"></script>
<script src="js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var list = LocalStore.get('bopeu_feedback')||[];
  document.getElementById('fbList').innerHTML = list.length ? list.map(function(f){
    var stars = '★'.repeat(f.rating) + '☆'.repeat(5-f.rating);
    return '<div class="row"><div class="row-icon">'+(f.type.charAt(0).toUpperCase())+'</div><div class="row-body"><div class="row-title">'+(f.subject||f.type)+' <span style="color:#F0A92B;margin-left:6px;">'+stars+'</span></div><div class="row-desc">'+f.text+'<br><span class="text-small text-muted">'+new Date(f.at).toLocaleString()+'</span></div></div></div>';
  }).join('') : '<div class="empty">No feedback submitted yet. Once members leave feedback, it will appear here for moderation.</div>';
});
</script>
</body></html>
