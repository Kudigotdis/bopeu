<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Content Analytics · BOPEU Admin</title><link rel="stylesheet" href="design-system.css">
<style>
body.bop{background:#F2F5F9}
.admin-header{background:#1A202C;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;bottom:0;z-index:20}
.admin-nav{display:flex;gap:16px;font-size:13px}
.admin-nav a{color:#fff;text-decoration:none;font-weight:600;opacity:.85}
.admin-layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 118px)}
.admin-side{background:#fff;border-right:1px solid #E2E8F0;padding:16px 12px}
.admin-side a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;color:#4A5568;text-decoration:none;margin-bottom:2px}
.admin-side a.active{background:#FFEBEE;color:#D32F2F}
.admin-main{padding:24px;max-width:1100px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:16px}
.kpi .lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#718096}
.kpi .val{font-size:26px;font-weight:800;color:#1A202C;margin-top:6px;line-height:1}
@media(max-width:820px){.admin-layout{grid-template-columns:1fr}.admin-side{display:none}}
</style></head>
<body data-page-id="Page-admin-content-analytics" class="bop">

<div class="app-header">
    <img src="Assets/logo/bopeu_logo.webp" alt="BOPEU" class="app-logo" data-logo-key="bopeu">
    <button type="button" id="loginToggleBtn" class="btn header-login-btn btn-secondary" onclick="handleLoginToggle()">Logout</button>
</div>

<div class="admin-layout">
  <aside class="admin-side">
    <a href="admin-dashboard.html">📊 Dashboard</a>
    <a href="admin-promotions.html">📣 Promotions</a>
    <a href="admin-noticeboards.html">📌 Notice Boards</a>
    <a href="admin-content-analytics.html" class="active">📊 Analytics</a>
  </aside>
  <main class="admin-main">
    <h1 style="font-size:22px;font-weight:800;margin:0 0 4px;">Content Analytics</h1>
    <p style="color:#718096;font-size:14px;margin:0 0 20px;">Impressions, views, clicks and shares across promotions and notices.</p>
    <div class="kpi-grid" id="kpiRow"></div>
    <div class="card"><div class="card-header"><h2>Top performing content</h2></div><div class="card-body" id="topContent"></div></div>
    <div class="card"><div class="card-header"><h2>Event breakdown</h2></div><div class="card-body" id="eventBreakdown"></div></div>
  </main>
</div>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script src="js/demo-profiles.js"></script>
<script src="js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var events = LocalStore.get('bopeu_content_events')||[];
  var imp = events.filter(function(e){return e.type==='impression';}).length;
  var view = events.filter(function(e){return e.type==='view';}).length;
  var click = events.filter(function(e){return e.type==='click';}).length;
  var share = events.filter(function(e){return e.type==='share';}).length;
  var redeems = events.filter(function(e){return e.type==='redemption';}).length;
  document.getElementById('kpiRow').innerHTML =
    '<div class="kpi"><div class="lbl">Impressions</div><div class="val">'+imp+'</div></div>' +
    '<div class="kpi"><div class="lbl">Views</div><div class="val">'+view+'</div></div>' +
    '<div class="kpi"><div class="lbl">Clicks</div><div class="val">'+click+'</div></div>' +
    '<div class="kpi"><div class="lbl">Shares</div><div class="val">'+share+'</div></div>' +
    '<div class="kpi"><div class="lbl">Redemptions</div><div class="val">'+redeems+'</div></div>';
  if (!events.length) {
    document.getElementById('topContent').innerHTML='<div class="empty">No events yet. As members interact with promotions and notices, analytics will populate here.</div>';
    document.getElementById('eventBreakdown').innerHTML='<div class="empty">—</div>';
    return;
  }
  var byContent = {};
  events.forEach(function(e){ if(!byContent[e.contentId]) byContent[e.contentId]={imp:0,views:0,clicks:0}; if(e.type==='impression')byContent[e.contentId].imp++; if(e.type==='view')byContent[e.contentId].views++; if(e.type==='click')byContent[e.contentId].clicks++; });
  document.getElementById('topContent').innerHTML = '<table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr style="background:#F7F9FC;"><th style="text-align:left;padding:8px;font-size:11px;text-transform:uppercase;color:#718096;">Content ID</th><th style="text-align:right;padding:8px;font-size:11px;text-transform:uppercase;color:#718096;">Impressions</th><th style="text-align:right;padding:8px;font-size:11px;text-transform:uppercase;color:#718096;">Views</th><th style="text-align:right;padding:8px;font-size:11px;text-transform:uppercase;color:#718096;">Clicks</th></tr></thead><tbody>'+Object.keys(byContent).map(function(k){var v=byContent[k];return '<tr><td style="padding:8px;border-top:1px solid #E2E8F0;">'+k+'</td><td style="padding:8px;border-top:1px solid #E2E8F0;text-align:right;">'+v.imp+'</td><td style="padding:8px;border-top:1px solid #E2E8F0;text-align:right;">'+v.views+'</td><td style="padding:8px;border-top:1px solid #E2E8F0;text-align:right;">'+v.clicks+'</td></tr>';}).join('')+'</tbody></table>';
  document.getElementById('eventBreakdown').innerHTML='<div class="empty">Event tracking enabled for '+events.length+' events.</div>';
});
</script>

<header class="admin-header">
  <nav class="admin-nav"><a href="admin-promotions.html">Marketing</a></nav>
</header>
</body></html>
