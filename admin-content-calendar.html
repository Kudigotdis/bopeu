<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Content Calendar · BOPEU Admin</title><link rel="stylesheet" href="design-system.css">
<style>
body.bop{background:#F2F5F9}
.admin-header{background:#1A202C;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;bottom:0;z-index:20}
.admin-mark{width:32px;height:32px;border-radius:8px;background:#D32F2F;display:grid;place-items:center;font-weight:800;color:#fff}
.admin-nav{display:flex;gap:16px;font-size:13px}
.admin-nav a{color:#fff;text-decoration:none;font-weight:600;opacity:.85}
.admin-layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 56px)}
.admin-side{background:#fff;border-right:1px solid #E2E8F0;padding:16px 12px}
.admin-side a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;color:#4A5568;text-decoration:none;margin-bottom:2px}
.admin-side a.active{background:#FFEBEE;color:#D32F2F}
.admin-main{padding:24px;max-width:1100px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:8px;}
.cal-day{background:#F7F9FC;border-radius:6px;min-height:90px;padding:6px;font-size:11px;}
.cal-day strong{display:block;font-weight:800;margin-bottom:4px;color:#718096;}
.cal-event{background:#FFEBEE;color:#B71C1C;border-radius:4px;padding:2px 4px;font-size:10px;margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
@media(max-width:820px){.admin-layout{grid-template-columns:1fr}.admin-side{display:none}}
</style></head>
<body data-page-id="Page-admin-content-calendar" class="bop">
<div class="admin-layout">
  <aside class="admin-side">
    <a href="admin-dashboard.html">📊 Dashboard</a>
    <a href="admin-promotions.html">📣 Promotions</a>
    <a href="admin-noticeboards.html">📌 Notice Boards</a>
    <a href="admin-content-analytics.html">📊 Analytics</a>
    <a href="admin-content-calendar.html" class="active">📅 Calendar</a>
  </aside>
  <main class="admin-main">
    <h1 style="font-size:22px;font-weight:800;margin:0 0 4px;">Content Calendar</h1>
    <p style="color:#718096;font-size:14px;margin:0 0 20px;">Scheduled promotions and notices.</p>
    <div class="cal-grid" id="calGrid"></div>
  </main>
</div>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script src="js/demo-profiles.js"></script>
<script src="js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var promos = LocalStore.get('bopeu_promotions')||[];
  var notices = LocalStore.get('bopeu_admin_notices')||[];
  var events = [];
  promos.forEach(function(p){ if(p.start) events.push({date:p.start,title:'[Promo] '+p.title}); });
  notices.forEach(function(n){ if(n.date) events.push({date:n.date,title:'[Notice] '+n.title}); });
  var now = new Date(); var first = new Date(now.getFullYear(), now.getMonth(), 1);
  var start = new Date(first); start.setDate(1 - first.getDay());
  var html = '';
  for (var w=0; w<5; w++){
    for (var d=0; d<7; d++){
      var cur = new Date(start); cur.setDate(start.getDate() + w*7 + d);
      var iso = cur.toISOString().slice(0,10);
      var dayEvents = events.filter(function(e){ return e.date===iso; }).map(function(e){ return '<div class="cal-event">'+e.title+'</div>'; }).join('');
      html += '<div class="cal-day"><strong>'+cur.getDate()+'</strong>'+dayEvents+'</div>';
    }
  }
  document.getElementById('calGrid').innerHTML = html;
});
</script>

<header class="admin-header">
  <div style="display:flex;align-items:center;gap:10px;"><div class="admin-mark">B</div><div><div style="font-weight:800;font-size:14px;">BOPEU Admin</div><div style="font-size:10px;opacity:.7;">Staff Portal</div></div></div>
  <nav class="admin-nav"><a href="admin-promotions.html">Marketing</a><a href="admin-login.html">Sign out</a></nav>
</header>
</body></html>
