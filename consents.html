<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Consents & Data Requests · BOPEU</title><link rel="stylesheet" href="design-system.css"></head>
<body data-page-id="Page-consents" class="bop">
<header style="background:#fff;border-bottom:1px solid #E2E8F0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;">
  <a href="profile.html" style="display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;">
    <div style="width:32px;height:32px;border-radius:8px;background:#D32F2F;color:#fff;display:grid;place-items:center;font-weight:800;">B</div>
    <div><div style="font-weight:800;font-size:14px;">BOPEU</div><div style="font-size:10px;color:#718096;">MEMBER SERVICES</div></div>
  </a>
  <a href="profile.html" style="font-size:13px;font-weight:700;color:#D32F2F;text-decoration:none;">← Profile</a>
</header>
<main class="page stack">
  <div class="card"><div class="card-header"><h2>Privacy consents</h2></div><div class="card-body">
    <div class="checklist-item"><input type="checkbox" id="cCore" onchange="saveConsent('core')"><label for="cCore"><strong>Core membership processing</strong> — required to administer membership.</label></div>
    <div class="checklist-item"><input type="checkbox" id="cFuneral" onchange="saveConsent('funeral')"><label for="cFuneral"><strong>Funeral cover enrolment</strong> — share salary & dependants with Metropolitan Life.</label></div>
    <div class="checklist-item"><input type="checkbox" id="cPartner" onchange="saveConsent('partner')"><label for="cPartner"><strong>Partner benefit sharing</strong> — share status (not identity) with benefit partners.</label></div>
    <div class="checklist-item"><input type="checkbox" id="cMarketing" onchange="saveConsent('marketing')"><label for="cMarketing"><strong>Marketing</strong> — receive union announcements and promotions.</label></div>
    <div class="checklist-item"><input type="checkbox" id="cAnalytics" onchange="saveConsent('analytics')"><label for="cAnalytics"><strong>Product analytics</strong> — anonymous usage data to improve the portal.</label></div>
  </div></div>
  <div class="card"><div class="card-header"><h2>Data subject requests</h2></div><div class="card-body">
    <p class="text-small text-muted" style="margin-bottom:12px;">Under the Botswana Data Protection Act 2024, you can request a copy of your data, ask us to correct it, or ask us to delete it. We respond within 30 days.</p>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="requestData('access')">Request data copy</button>
      <button class="btn btn-secondary" onclick="requestData('correction')">Request correction</button>
      <button class="btn btn-secondary" onclick="requestData('delete')">Request deletion</button>
    </div>
  </div></div>
  <div class="card"><div class="card-header"><h2>My requests</h2></div><div class="card-body" id="dsrList"></div></div>
</main>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var c = LocalStore.get('bopeu_consents')||{core:true,funeral:true,partner:false,marketing:true,analytics:false};
  ['core','funeral','partner','marketing','analytics'].forEach(function(k){
    var el = document.getElementById('c'+k.charAt(0).toUpperCase()+k.slice(1));
    if (el) el.checked=!!c[k];
  });
  renderDsr();
});
function saveConsent(k){ var c=LocalStore.get('bopeu_consents')||{}; var el=document.getElementById('c'+k.charAt(0).toUpperCase()+k.slice(1)); c[k]=el.checked; LocalStore.set('bopeu_consents',c); }
function requestData(kind){
  var list = LocalStore.get('bopeu_dsr')||[];
  list.unshift({id:'DSR-'+Date.now(),kind:kind,status:'submitted',at:new Date().toISOString()});
  LocalStore.set('bopeu_dsr',list);
  renderDsr();
  alert('Request submitted. Reference DSR-'+Date.now());
}
function renderDsr(){
  var list = LocalStore.get('bopeu_dsr')||[];
  var box = document.getElementById('dsrList');
  if (!list.length){ box.innerHTML='<div class="empty">No requests yet.</div>'; return; }
  box.innerHTML = list.map(function(r){
    return '<div class="checklist-item"><span class="chk-num">'+r.kind.charAt(0).toUpperCase()+'</span><span><strong>'+r.kind+'</strong> · Ref '+r.id+'<br><span class="text-small text-muted">'+new Date(r.at).toLocaleString()+' · '+r.status+'</span></span></div>';
  }).join('');
}
</script>
</body></html>
