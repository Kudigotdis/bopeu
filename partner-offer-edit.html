<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Edit Offer · BOPEU Partner</title><link rel="stylesheet" href="design-system.css">
<style>
body.bop{background:#F2F5F9}
.p-header{background:#0F7A4D;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.p-mark{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:800;color:#fff}
.p-nav{display:flex;gap:16px;font-size:13px}
.p-nav a{color:#fff;text-decoration:none;font-weight:600;opacity:.85}
.p-layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 56px)}
.p-side{background:#fff;border-right:1px solid #E2E8F0;padding:16px 12px}
.p-side a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;color:#4A5568;text-decoration:none;margin-bottom:2px}
.p-side a.active{background:#E7F4EC;color:#0F7A4D}
.p-main{padding:24px;max-width:900px}
@media(max-width:820px){.p-layout{grid-template-columns:1fr}.p-side{display:none}}
</style></head>
<body class="bop">
<header class="p-header">
  <div style="display:flex;align-items:center;gap:10px;"><div class="p-mark">P</div><div><div style="font-weight:800;font-size:14px;">BOPEU Partner</div><div style="font-size:10px;opacity:.8;">Benefit Partner Portal</div></div></div>
  <nav class="p-nav"><a href="partner-offers.html">Offers</a><a href="partner-login.html">Sign out</a></nav>
</header>
<div class="p-layout">
  <aside class="p-side"><a href="partner-dashboard.html">📊 Dashboard</a><a href="partner-offers.html" class="active">🎁 Offers</a></aside>
  <main class="p-main">
    <a href="partner-offers.html" style="font-size:13px;font-weight:700;color:#0F7A4D;text-decoration:none;">← Offers</a>
    <h1 style="font-size:22px;font-weight:800;margin:8px 0 20px;">Edit Offer</h1>
    <div class="card"><div class="card-body">
      <div class="form-group"><label class="form-label">Offer title</label><input type="text" id="oTitle"></div>
      <div class="form-group"><label class="form-label">Offer summary (short)</label><input type="text" id="oDiscount" placeholder="e.g. Up to 35% off lab tests"></div>
      <div class="form-group"><label class="form-label">Details</label><textarea id="oDetail" rows="4" style="width:100%;padding:10px;border:1px solid #E2E8F0;border-radius:10px;font-family:inherit;font-size:14px;"></textarea></div>
      <div class="form-group"><label class="form-label">How members claim</label><textarea id="oHow" rows="2" style="width:100%;padding:10px;border:1px solid #E2E8F0;border-radius:10px;font-family:inherit;font-size:14px;"></textarea></div>
      <div class="form-group"><label class="form-label">Valid from</label><input type="date" id="oStart"></div>
      <div class="form-group"><label class="form-label">Valid to (optional)</label><input type="date" id="oEnd"></div>
      <div class="callout"><span class="callout-label">Approval</span><p>Offers must be approved by BOPEU before they go live to members. You'll be notified by email once reviewed.</p></div>
      <div class="btn-row mt-md"><a class="btn btn-secondary" href="partner-offers.html">Cancel</a><button class="btn btn-primary" style="background:#0F7A4D;border-color:#0F7A4D;" onclick="saveOffer()">Submit for approval</button></div>
    </div></div>
  </main>
</div>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script src="js/demo-profiles.js"></script>
<script src="js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var id = new URLSearchParams(location.search).get('id');
  if (!id) return;
  var offers = LocalStore.get('bopeu_partner_offers')||[];
  var o = offers.find(function(x){return x.id===id;}) || {};
  document.getElementById('oTitle').value=o.title||''; document.getElementById('oDiscount').value=o.discount||'';
  document.getElementById('oDetail').value=o.detail||''; document.getElementById('oHow').value=o.how||'';
  document.getElementById('oStart').value=o.start||''; document.getElementById('oEnd').value=o.end||'';
});
function saveOffer(){
  var o = {id:new URLSearchParams(location.search).get('id')||'O-'+Date.now(),title:document.getElementById('oTitle').value,discount:document.getElementById('oDiscount').value,detail:document.getElementById('oDetail').value,how:document.getElementById('oHow').value,start:document.getElementById('oStart').value,end:document.getElementById('oEnd').value,status:'pending',submittedAt:new Date().toISOString()};
  if (!o.title||!o.discount){ alert('Title and summary required.'); return; }
  var offers = (LocalStore.get('bopeu_partner_offers')||[]).filter(function(x){return x.id!==o.id;});
  offers.unshift(o); LocalStore.set('bopeu_partner_offers',offers);
  alert('Offer submitted for BOPEU approval.'); location.href='partner-offers.html';
}
</script>
</body></html>
