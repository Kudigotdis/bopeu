<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Promotions · BOPEU Admin</title><link rel="stylesheet" href="design-system.css">
<style>
body.bop{background:#F2F5F9}
.admin-header{background:#1A202C;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;bottom:0;z-index:20}
.admin-nav{display:flex;gap:16px;font-size:13px}
.admin-nav a{color:#fff;text-decoration:none;font-weight:600;opacity:.85}
.admin-layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 118px)}
.admin-side{background:#fff;border-right:1px solid #E2E8F0;padding:16px 12px}
.admin-side a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;color:#4A5568;text-decoration:none;margin-bottom:2px}
.admin-side a.active{background:#FFEBEE;color:#D32F2F}
.admin-main{padding:24px;max-width:1100px}
.admin-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.admin-table th{background:#F7F9FC;text-align:left;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#718096;padding:12px;border-bottom:1px solid #E2E8F0}
.admin-table td{padding:12px;border-bottom:1px solid #E2E8F0;font-size:14px;color:#1A202C}
@media(max-width:820px){.admin-layout{grid-template-columns:1fr}.admin-side{display:none}}
</style></head>
<body data-page-id="Page-admin-promotions" class="bop">

<div class="app-header">
    <img src="Assets/logo/bopeu_logo.webp" alt="BOPEU" class="app-logo" data-logo-key="bopeu">
    <button type="button" id="loginToggleBtn" class="btn header-login-btn btn-secondary" onclick="handleLoginToggle()">Logout</button>
</div>

<div class="admin-layout">
  <aside class="admin-side">
    <a href="admin-dashboard.html">📊 Dashboard</a>
    <a href="admin-promotions.html" class="active">📣 Promotions</a>
    <a href="admin-noticeboards.html">📌 Notice Boards</a>
    <a href="admin-content-analytics.html">📊 Analytics</a>
    <a href="admin-content-calendar.html">📅 Calendar</a>
    <a href="admin-media-library.html">🖼 Media</a>
  </aside>
  <main class="admin-main">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <div><h1 style="font-size:22px;font-weight:800;margin:0;">Promotions</h1><p style="color:#718096;font-size:14px;margin:4px 0 0;">Promotions shown on the member timeline.</p></div>
      <a href="admin-promotion-edit.html" class="btn btn-primary">+ New promotion</a>
    </div>
    <table class="admin-table"><thead><tr><th>Title</th><th>Audience</th><th>Schedule</th><th>Status</th><th></th></tr></thead><tbody id="promoList"></tbody></table>
  </main>
</div>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script src="js/demo-profiles.js"></script>
<script src="js/auth.js"></script>
<script>
var DEMO_PROMOS = [
  {id:'P-1',title:'Diagnofirm Health Week',audience:'All members',start:'2026-09-01',end:'2026-09-30',status:'live'},
  {id:'P-2',title:'Funeral Cover Awareness',audience:'Central Government',start:'2026-10-01',end:'2026-10-31',status:'scheduled'},
  {id:'P-3',title:'Bursary Applications Open',audience:'All members',start:'2026-08-01',end:'2026-08-31',status:'ended'}
];
document.addEventListener('DOMContentLoaded', function(){
  var custom = LocalStore.get('bopeu_promotions')||[];
  var rows = custom.concat(DEMO_PROMOS);
  document.getElementById('promoList').innerHTML = rows.map(function(p){
    var cls = p.status==='live'?'badge-green':(p.status==='scheduled'?'badge-blue':'badge-grey');
    return '<tr><td><strong>'+p.title+'</strong></td><td>'+p.audience+'</td><td>'+p.start+' → '+p.end+'</td><td><span class="badge '+cls+'">'+p.status+'</span></td><td><a href="admin-promotion-edit.html?id='+p.id+'" style="font-weight:700;color:#D32F2F;text-decoration:none;">Edit →</a></td></tr>';
  }).join('');
});
</script>

<header class="admin-header">
  <nav class="admin-nav"><a href="admin-dashboard.html">Dashboard</a><a href="admin-promotions.html" style="text-decoration:underline;">Marketing</a><a href="admin-members.html">Members</a></nav>
</header>
</body></html>
