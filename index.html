<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOPEU App - Timeline Feed</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        /* TIMELINE PAGE SPECIFIC STYLES */
        body {
            margin: 0;
            padding: 0;
            background: #F7F9FC;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #1A202C;
            font-size: 16px;
            line-height: 1.5;
        }
        
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            box-shadow: 0 2px 20px rgba(0,0,0,0.08);
        }
        
        /* Header */
        .app-header {
            background: white;
            border-bottom: 1px solid #E4E9F0;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .app-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border-radius: 0;
        }
        
        /* Remove app-title styling */
        
        /* Content Area */
        .content-area {
            padding: 24px;
        }
        
        /* Feed cards container - removed tl-intro */
        .feed-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        /* Feed card styling - removed circular container */
        .feed-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .feed-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(211,47,47,0.15);
        }
        
        /* Image container - fixed for missing images */
        .feed-image {
            position: relative;
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, #FFEBEE, #F7DCE1);
            overflow: hidden;
        }
        
        .feed-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .feed-image.no-feed-img::after {
            content: "BOPEU";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 0.2em;
            color: rgba(211,47,47,0.35);
        }
        
        /* Content styling */
        .feed-content {
            padding: 20px;
        }
        
        /* Meta styling - grey text, no red pill background */
        .feed-meta {
            font-size: 0.9rem;
            font-weight: 600;
            color: #718096;
            margin-bottom: 12px;
            letter-spacing: 0.02em;
        }
        
        /* Title styling */
        .feed-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #1A202C;
            margin: 0 0 8px 0;
            line-height: 1.3;
            letter-spacing: -0.01em;
        }
        
        /* Description styling */
        .feed-description {
            font-size: 1rem;
            color: #718096;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #D32F2F;
            border-top: 1px solid #B71C1C;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 1000;
            box-shadow: 0 -4px 20px rgba(211,47,47,0.3);
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 12px;
        }
        
        .nav-item.active {
            background: transparent;
        }
        
        .nav-item img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }

        /* Modals placeholder */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15,23,32,0.55);
            backdrop-filter: blur(3px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        
        .modal.open {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 24px;
            max-width: 500px;
            width: 100%;
            max-height: 88vh;
            overflow-y: auto;
            box-shadow: 0 24px 60px rgba(0,0,0,0.38);
            position: relative;
        }
        
        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border: none;
            background: #F7F9FC;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Scripts container */
        .scripts-container {
            display: none;
        }
    </style>
    
    <!-- ALL MODALS FROM ORIGINAL INDEX.HTML -->
    
    <!-- Login -->
    <div class="modal" id="login-modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('login-modal')">✕</button>
            <div id="loginModalBody"></div>
        </div>
    </div>
</head>
<body class="bop">
    <div class="app-container">
        <!-- Header -->
        <div class="app-header">
            <img src="./Assets/logo/bopeu_logo.webp" alt="BOPEU" class="app-logo">
        </div>
        
        <!-- Content Area -->
        <div class="content-area">
            <!-- Timeline intro removed as requested -->
            
            <div id="timelineFeed"></div>
        </div>
        
    </div>
    </div>
    
    <!-- Timeline post modal -->
    <div class="post-modal-overlay" id="postModal" aria-hidden="true"><div class="post-modal" role="dialog" aria-modal="true" aria-label="Timeline post"><div class="post-modal-media no-img" id="postModalMedia"><img id="postModalImage" alt="" loading="eager"></div><div class="post-modal-body" id="postModalBody"></div></div></div>
    <script>
    // Close timeline post modal on backdrop click or Escape
    document.addEventListener('click', function (e) {
        var overlay = document.getElementById('postModal');
        if (overlay && e.target === overlay && overlay.classList.contains('active')) {
            closeModal('postModal');
        }
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            var overlay = document.getElementById('postModal');
            if (overlay && overlay.classList.contains('active')) closeModal('postModal');
        }
    });
    </script>
    <!-- JavaScript Files -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
<script src="js/demo-profiles.js"></script>
<script src="js/auth.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/load-bottom-nav.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof loadBottomNav === 'function') {
                loadBottomNav('index');
            }
        });
    </script>
</body>
</html>
