<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Offer · BOPEU</title><link rel="stylesheet" href="design-system.css"></head>
<body class="bop">
<header style="background:#fff;border-bottom:1px solid #E2E8F0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;">
  <a href="my-benefits.html" style="display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;">
    <div style="width:32px;height:32px;border-radius:8px;background:#D32F2F;color:#fff;display:grid;place-items:center;font-weight:800;">B</div>
    <div><div style="font-weight:800;font-size:14px;">BOPEU</div><div style="font-size:10px;color:#718096;">MEMBER SERVICES</div></div>
  </a>
  <a href="my-benefits.html" style="font-size:13px;font-weight:700;color:#D32F2F;text-decoration:none;">← Benefits</a>
</header>
<main class="page stack" id="offerMain">
  <div class="empty">Loading…</div>
</main>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var id = new URLSearchParams(location.search).get('id');
  var p = BOPEU_BENEFIT_PARTNERS.find(function(x){ return x.id===id; });
  if (!p){ document.getElementById('offerMain').innerHTML = '<div class="empty">Offer not found.</div>'; return; }
  var status = p.status==='verified' ? 'Confirmed offer' : 'Terms to confirm';
  var code = 'BOP-' + p.id.toUpperCase().slice(0,6) + '-2026';
  document.getElementById('offerMain').innerHTML =
    '<div class="card"><div class="card-head"><h2>'+p.name+'</h2><div class="card-sub">'+p.category+' · '+status+'</div></div>' +
    '<div class="card-body">' +
    '<div class="callout"><span class="callout-label">Member offer</span><p>'+p.discount+'</p></div>' +
    '<h3 style="font-size:15px;margin:16px 0 8px;">Details</h3><p>'+p.detail+'</p>' +
    '<h3 style="font-size:15px;margin:16px 0 8px;">How to claim</h3><p>'+p.how+'</p>' +
    '</div></div>' +
    '<div class="card"><div class="card-header"><h2>Redemption</h2></div><div class="card-body">' +
    '<div class="checklist-item"><span class="chk-num">✓</span><span>Redemption code: <strong style="font-family:monospace;font-size:16px;">'+code+'</strong></span></div>' +
    '<div class="checklist-item"><span class="chk-num">📱</span><span>Show this code or your digital membership card at the partner.</span></div>' +
    '<div class="btn-row mt-md">' +
    '<button class="btn btn-primary" onclick="expressInterest(\''+p.id+'\')">Express interest</button>' +
    '<button class="btn btn-secondary" onclick="openFeedback(\''+p.id+'\')">Leave feedback</button>' +
    '</div></div></div>';
});
function expressInterest(id){ LocalStore.set('bopeu_interest_'+id,{at:new Date().toISOString()}); alert('Interest recorded. The partner will contact you.'); }
function openFeedback(id){ location.href='feedback.html?type=partner&id='+encodeURIComponent(id); }
</script>
</body></html>
