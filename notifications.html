<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications · BOPEU</title>
<link rel="stylesheet" href="design-system.css">
<style>
  .modal { position: fixed; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(15,23,32,.55); }
  .modal.active { display: flex; }
  .modal-card { width: 100%; max-width: 560px; max-height: 88vh; background: var(--bop-white); border-radius: var(--bop-radius); overflow-y: auto; padding: 20px; box-shadow: 0 24px 60px rgba(0,0,0,.38); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--bop-line); }
  .modal-title { font-size: 18px; font-weight: 800; margin: 0; }
  .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--bop-muted); padding: 4px 8px; line-height: 1; }
</style>
</head>
<body data-page-id="Page-notifications" class="bop">

<header style="background:#fff;border-bottom:1px solid #E2E8F0;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;">
  <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;">
    <div style="width:32px;height:32px;border-radius:8px;background:#D32F2F;color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;">B</div>
    <div>
      <div style="font-weight:800;font-size:14px;line-height:1;color:#1A202C;">BOPEU</div>
      <div style="font-size:10px;color:#718096;letter-spacing:.06em;margin-top:2px;">MEMBER SERVICES</div>
    </div>
  </a>
  <a href="index.html" style="font-size:13px;font-weight:700;color:#D32F2F;text-decoration:none;">← Home</a>
</header>

<main class="page stack">

  <div class="search">
    <div class="search-input">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-3.2-3.2"></path>
      </svg>
      <input type="text" id="updateSearch" placeholder="Search notices and updates..." oninput="handleSearch()" onkeyup="handleSearch()">
    </div>
    <button class="search-btn" onclick="handleSearch()">Go</button>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>Notice Board</h2>
      <span class="count-badge" id="noticeCount">4</span>
    </div>
    <div class="card-body">
      <div class="feed" id="noticesList">
        <!-- rendered by notices.js -->
      </div>
      <div class="empty" id="noticeEmpty" hidden>
        <span>No notices match your search.</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>Recent Updates</h2>
      <span class="count-badge" id="articleCount">4</span>
    </div>
    <div class="card-body">
      <div id="articleList"></div>
      <div class="empty" id="articleEmpty" hidden>
        <span>No recent updates match your search.</span>
      </div>
    </div>
  </div>

</main>

<!-- Article modal -->
<div class="modal" id="article-modal" data-view-id="Page-notifications-article-modal">
  <div class="modal-card">
    <div class="modal-head">
      <h2 class="modal-title" id="articleTitle">Article</h2>
      <button class="modal-close" onclick="closeModal('article-modal')">&times;</button>
    </div>
    <div id="articleDate" style="color:var(--bop-muted);font-size:13px;margin-bottom:12px;"></div>
    <div id="articleBody" style="font-size:15px;line-height:1.6;"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/notices.js"></script>
</body>
</html>
