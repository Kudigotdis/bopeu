<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Approvals · BOPEU Admin</title><link rel="stylesheet" href="design-system.css">
<style>
body.bop{background:#F2F5F9}
.admin-header{background:#1A202C;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.admin-mark{width:32px;height:32px;border-radius:8px;background:#D32F2F;display:grid;place-items:center;font-weight:800;color:#fff}
.admin-nav{display:flex;gap:16px;font-size:13px}
.admin-nav a{color:#fff;text-decoration:none;font-weight:600;opacity:.85}
.admin-layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 56px)}
.admin-side{background:#fff;border-right:1px solid #E2E8F0;padding:16px 12px}
.admin-side a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;color:#4A5568;text-decoration:none;margin-bottom:2px}
.admin-side a.active{background:#FFEBEE;color:#D32F2F}
.admin-main{padding:24px;max-width:1100px}
@media(max-width:820px){.admin-layout{grid-template-columns:1fr}.admin-side{display:none}}
</style></head>
<body data-page-id="Page-admin-approvals" class="bop">
<header class="admin-header">
  <div style="display:flex;align-items:center;gap:10px;"><div class="admin-mark">B</div><div><div style="font-weight:800;font-size:14px;">BOPEU Admin</div><div style="font-size:10px;opacity:.7;">Staff Portal</div></div></div>
  <nav class="admin-nav"><a href="admin-dashboard.html">Dashboard</a><a href="admin-approvals.html" style="text-decoration:underline;">Approvals</a><a href="admin-login.html">Sign out</a></nav>
</header>
<div class="admin-layout">
  <aside class="admin-side">
    <a href="admin-dashboard.html">📊 Dashboard</a>
    <a href="admin-approvals.html" class="active">✅ Approvals</a>
    <a href="admin-reports.html">📈 Reports</a>
  </aside>
  <main class="admin-main">
    <h1 style="font-size:22px;font-weight:800;margin:0 0 4px;">Approval Queue</h1>
    <p style="color:#718096;font-size:14px;margin:0 0 20px;">Maker-checker approvals awaiting your review.</p>
    <div class="chip-row" style="margin-bottom:16px;">
      <button class="chip active">All pending</button>
      <button class="chip">Content</button>
      <button class="chip">Partner offers</button>
      <button class="chip">Rate changes</button>
      <button class="chip">Access requests</button>
    </div>
    <div class="row-list" id="approvalList"></div>
  </main>
</div>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script src="js/demo-profiles.js"></script>
<script src="js/auth.js"></script>
<script>
var DEMO_APPROVALS = [
  {id:'A-1',type:'Content',title:'Promotion: "Diagnofirm Health Week"',by:'T. Molefe',at:'2026-09-18',href:'admin-promotions.html'},
  {id:'A-2',type:'Partner offer',title:'Offer approval: Access Bank revised lending',by:'N. Sekgoma',at:'2026-09-19',href:'admin-partner-detail.html?id=access_bank'},
  {id:'A-3',type:'Rate change',title:'Membership calculator rate: 1% → 1%',by:'K. Modise',at:'2026-09-20',href:'admin-reports.html'},
  {id:'A-4',type:'Access request',title:'New staff account: n.sekgoma@bopeu.org.bw',by:'K. Modise',at:'2026-09-20',href:'admin-staff.html'}
];
document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('approvalList').innerHTML = DEMO_APPROVALS.map(function(a){
    return '<div class="row"><div class="row-icon">'+a.type.charAt(0)+'</div><div class="row-body"><div class="row-title">'+a.title+'</div><div class="row-desc">'+a.type+' · '+a.by+' · '+a.at+'</div></div><div style="display:flex;gap:6px;"><button class="btn btn-secondary btn-small" onclick="reject(\''+a.id+'\')">Reject</button><button class="btn btn-primary btn-small" onclick="approve(\''+a.id+'\')">Approve</button></div></div>';
  }).join('') || '<div class="empty">Nothing pending.</div>';
});
function approve(id){ alert('Approved '+id+' (demo).'); }
function reject(id){ alert('Rejected '+id+' (demo).'); }
</script>
</body></html>
