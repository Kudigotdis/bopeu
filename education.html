<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Education - BOPEU Digital Platform</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .bottom-nav a.nav-item {
            text-decoration: none;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="app-container" id="appContainer">

        <div class="app-header">
            <a class="tb-home" href="index.html" title="Back to BOPEU app"><img src="Assets/logo/bopeu_logo.webp" alt="BOPEU Logo" class="app-logo"></a>
        </div>

        <div class="content-area">
            <div class="tab-page active">
                <div id="eduSummary"></div>

                <div class="card">
                    <div class="card-header">Quick Quiz</div>
                    <div id="quizContainer">
                        <div id="quizBody"></div>
                        <div id="quizResult" style="margin-top:10px;"></div>
                    </div>
                </div>
            </div>
        </div>

</div>

    <script>
        function esc(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }
    </script>
    <script src="js/data.js"></script>
    <script src="js/education.js"></script>

    <script src="js/load-bottom-nav.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof loadBottomNav === 'function') {
                loadBottomNav('');
            }
        });
    </script>
</body>
</html>
