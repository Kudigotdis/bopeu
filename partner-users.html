<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Users · BOPEU Partner</title><link rel="stylesheet" href="design-system.css">
<style>
body.bop{background:#F2F5F9}
.p-header{background:#0F7A4D;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.p-mark{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:800;color:#fff}
.p-nav{display:flex;gap:16px;font-size:13px}
.p-nav a{color:#fff;text-decoration:none;font-weight:600;opacity:.85}
.p-layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 56px)}
.p-side{background:#fff;border-right:1px solid #E2E8F0;padding:16px 12px}
.p-side a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;color:#4A5568;text-decoration:none;margin-bottom:2px}
.p-side a.active{background:#E7F4EC;color:#0F7A4D}
.p-main{padding:24px;max-width:1100px}
.admin-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:13px}
.admin-table th{background:#F7F9FC;text-align:left;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#718096;padding:12px;border-bottom:1px solid #E2E8F0}
.admin-table td{padding:12px;border-bottom:1px solid #E2E8F0;color:#1A202C}
@media(max-width:820px){.p-layout{grid-template-columns:1fr}.p-side{display:none}}
</style></head>
<body data-page-id="Page-partner-users" class="bop">
<header class="p-header">
  <div style="display:flex;align-items:center;gap:10px;"><div class="p-mark">P</div><div><div style="font-weight:800;font-size:14px;">BOPEU Partner</div><div style="font-size:10px;opacity:.8;">Benefit Partner Portal</div></div></div>
  <nav class="p-nav"><a href="partner-dashboard.html">Dashboard</a><a href="partner-login.html">Sign out</a></nav>
</header>
<div class="p-layout">
  <aside class="p-side">
    <a href="partner-dashboard.html">📊 Dashboard</a>
    <a href="partner-users.html" class="active">👥 Users</a>
  </aside>
  <main class="p-main">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <div><h1 style="font-size:22px;font-weight:800;margin:0;">Your team</h1><p style="color:#718096;font-size:14px;margin:4px 0 0;">Users who can access your partner portal.</p></div>
      <button class="btn btn-primary" style="background:#0F7A4D;border-color:#0F7A4D;" onclick="inviteUser()">+ Invite user</button>
    </div>
    <table class="admin-table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody id="userList"></tbody></table>
  </main>
</div>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script src="js/demo-profiles.js"></script>
<script src="js/auth.js"></script>
<script>
function renderUsers(){
  var list = LocalStore.get('bopeu_partner_users')||[{name:'Primary contact',email:'partner@example.com',role:'Owner',status:'active'}];
  document.getElementById('userList').innerHTML = list.map(function(u){
    var cls = u.status==='active'?'badge-green':'badge-blue';
    return '<tr><td><strong>'+u.name+'</strong></td><td>'+u.email+'</td><td>'+u.role+'</td><td><span class="badge '+cls+'">'+u.status+'</span></td></tr>';
  }).join('');
}
function inviteUser(){
  var email = prompt('Email address of the new partner user:');
  if (!email) return;
  var list = LocalStore.get('bopeu_partner_users')||[{name:'Primary contact',email:'partner@example.com',role:'Owner',status:'active'}];
  list.push({name:email.split('@')[0],email:email,role:'Member',status:'invited'});
  LocalStore.set('bopeu_partner_users',list); renderUsers();
}
document.addEventListener('DOMContentLoaded', renderUsers);
</script>
</body></html>
