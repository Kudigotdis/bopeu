<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content · BOPEU Admin</title>
<link rel="stylesheet" href="design-system.css">
<style>
  body.bop { background:#F2F5F9; }
  .admin-header { background:#1A202C; color:#fff; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:20; }
  .admin-brand { display:flex; align-items:center; gap:10px; }
  .admin-mark { width:32px; height:32px; border-radius:8px; background:#D32F2F; display:grid; place-items:center; font-weight:800; color:#fff; }
  .admin-nav { display:flex; gap:16px; font-size:13px; }
  .admin-nav a { color:#fff; text-decoration:none; font-weight:600; opacity:.85; }
  .admin-layout { display:grid; grid-template-columns:220px 1fr; min-height:calc(100vh - 56px); }
  .admin-side { background:#fff; border-right:1px solid #E2E8F0; padding:16px 12px; }
  .admin-side a { display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:8px; font-size:13px; font-weight:600; color:#4A5568; text-decoration:none; margin-bottom:2px; }
  .admin-side a.active { background:#FFEBEE; color:#D32F2F; }
  .admin-main { padding:24px; max-width:1000px; }
  .admin-table { width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.03); }
  .admin-table th { background:#F7F9FC; text-align:left; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:#718096; padding:12px; border-bottom:1px solid #E2E8F0; }
  .admin-table td { padding:12px; border-bottom:1px solid #E2E8F0; font-size:14px; color:#1A202C; }
  .admin-table tr:hover td { background:#FAFBFD; }
  @media (max-width:820px) { .admin-layout { grid-template-columns:1fr; } .admin-side { display:none; } }
</style>
</head>
<body class="bop">

<header class="admin-header">
  <div class="admin-brand">
    <div class="admin-mark">B</div>
    <div><div style="font-weight:800; font-size:14px;">BOPEU Admin</div><div style="font-size:10px; opacity:.7;">Staff Portal</div></div>
  </div>
  <nav class="admin-nav">
    <a href="admin-dashboard.html">Dashboard</a>
    <a href="admin-submissions.html">Submissions</a>
    <a href="admin-members.html">Members</a>
    <a href="admin-content.html" style="text-decoration:underline;">Content</a>
    <a href="admin-reports.html">Reports</a>
    <a href="admin-login.html">Sign out</a>
  </nav>
</header>

<div class="admin-layout">
  <aside class="admin-side">
    <a href="admin-dashboard.html">📊 Dashboard</a>
    <a href="admin-submissions.html">📥 Submissions</a>
    <a href="admin-members.html">👥 Members</a>
    <a href="admin-content.html" class="active">📰 Content</a>
    <a href="admin-users-roles.html">🔐 Users &amp; Roles</a>
    <a href="admin-audit-log.html">📜 Audit Log</a>
    <a href="admin-reports.html">📈 Reports</a>
  </aside>

  <main class="admin-main">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;">
      <div>
        <h1 style="font-size:22px;font-weight:800;margin-bottom:4px;">News, Notices &amp; Announcements</h1>
        <p style="color:#718096;font-size:14px;">Publish content to the member portal.</p>
      </div>
      <button class="btn btn-primary" onclick="document.getElementById('newContentForm').style.display='block'">+ New item</button>
    </div>

    <div id="newContentForm" style="display:none;background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:16px;margin-bottom:16px;">
      <div class="form-group">
        <label class="form-label">Title</label>
        <input type="text" id="newContentTitle" placeholder="e.g. Revised Lending Scheme">
      </div>
      <div class="form-group">
        <label class="form-label">Body</label>
        <textarea id="newContentBody" rows="3" style="width:100%;padding:10px;border:1px solid #E2E8F0;border-radius:10px;font-family:inherit;font-size:14px;"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Audience</label>
        <select id="newContentAudience" style="width:100%;padding:10px;border:1px solid #E2E8F0;border-radius:10px;font-family:inherit;font-size:14px;">
          <option>All members</option>
          <option>Central Government</option>
          <option>Local Authority</option>
          <option>Land Board</option>
          <option>Parastatal</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="document.getElementById('newContentForm').style.display='none'">Cancel</button>
        <button class="btn btn-primary" onclick="publishContent()">Publish</button>
      </div>
    </div>

    <table class="admin-table">
      <thead><tr><th>Title</th><th>Audience</th><th>Published</th><th>Status</th></tr></thead>
      <tbody id="contentList"></tbody>
    </table>
  </main>
</div>

<div class="modal" id="admin-modal" style="position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(15,23,32,.55);">
  <div style="width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:#fff;border-radius:16px;padding:20px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #E2E8F0;">
      <h2 style="font-size:18px;font-weight:800;margin:0;" id="adminModalTitle">Admin</h2>
      <button style="background:none;border:none;font-size:24px;cursor:pointer;color:#718096;" onclick="closeModal('admin-modal')">&times;</button>
    </div>
    <div id="adminModalBody"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/demo-profiles.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
<script>
  function renderContentList() {
    var custom = LocalStore.get('bopeu_admin_content') || [];
    var seed = (BOPEU_NOTICES || []).map(function (n) {
      return { title: n.title, date: n.date, audience: 'All members', status: 'published' };
    });
    var rows = custom.concat(seed);
    document.getElementById('contentList').innerHTML = rows.map(function (r) {
      return '<tr>' +
        '<td><strong>' + r.title + '</strong></td>' +
        '<td>' + (r.audience || 'All members') + '</td>' +
        '<td>' + (r.date || '—') + '</td>' +
        '<td><span class="badge badge-green">' + (r.status || 'published') + '</span></td>' +
        '</tr>';
    }).join('');
  }

  function publishContent() {
    var title = document.getElementById('newContentTitle').value.trim();
    var body  = document.getElementById('newContentBody').value.trim();
    var aud   = document.getElementById('newContentAudience').value;
    if (!title || !body) { alert('Title and body required.'); return; }
    var custom = LocalStore.get('bopeu_admin_content') || [];
    custom.unshift({ title: title, body: body, audience: aud, date: new Date().toISOString().slice(0, 10), status: 'published' });
    LocalStore.set('bopeu_admin_content', custom);
    document.getElementById('newContentTitle').value = '';
    document.getElementById('newContentBody').value = '';
    document.getElementById('newContentForm').style.display = 'none';
    renderContentList();
    alert('Content published.');
  }

  document.addEventListener('DOMContentLoaded', renderContentList);
</script>
</body>
</html>
