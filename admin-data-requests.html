<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Data Requests · BOPEU Admin</title><link rel="stylesheet" href="design-system.css">
<style>
body.bop{background:#F2F5F9}
.admin-header{background:#1A202C;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.admin-mark{width:32px;height:32px;border-radius:8px;background:#D32F2F;display:grid;place-items:center;font-weight:800;color:#fff}
.admin-nav{display:flex;gap:16px;font-size:13px}
.admin-nav a{color:#fff;text-decoration:none;font-weight:600;opacity:.85}
.admin-layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 56px)}
.admin-side{background:#fff;border-right:1px solid #E2E8F0;padding:16px 12px}
.admin-side a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;color:#4A5568;text-decoration:none;margin-bottom:2px}
.admin-side a.active{background:#FFEBEE;color:#D32F2F}
.admin-main{padding:24px;max-width:1100px}
.admin-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:13px}
.admin-table th{background:#F7F9FC;text-align:left;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#718096;padding:12px;border-bottom:1px solid #E2E8F0}
.admin-table td{padding:12px;border-bottom:1px solid #E2E8F0;color:#1A202C}
@media(max-width:820px){.admin-layout{grid-template-columns:1fr}.admin-side{display:none}}
</style></head>
<body data-page-id="Page-admin-data-requests" class="bop">
<header class="admin-header">
  <div style="display:flex;align-items:center;gap:10px;"><div class="admin-mark">B</div><div><div style="font-weight:800;font-size:14px;">BOPEU Admin</div><div style="font-size:10px;opacity:.7;">Staff Portal</div></div></div>
  <nav class="admin-nav"><a href="admin-dashboard.html">Dashboard</a><a href="admin-data-requests.html" style="text-decoration:underline;">Data Requests</a><a href="admin-login.html">Sign out</a></nav>
</header>
<div class="admin-layout">
  <aside class="admin-side">
    <a href="admin-dashboard.html">📊 Dashboard</a>
    <a href="admin-data-requests.html" class="active">📋 Data Requests</a>
    <a href="admin-audit-log.html">📜 Audit Log</a>
  </aside>
  <main class="admin-main">
    <h1 style="font-size:22px;font-weight:800;margin:0 0 4px;">Data Subject Requests</h1>
    <p style="color:#718096;font-size:14px;margin:0 0 20px;">DSAR requests from members under the Botswana Data Protection Act 2024. Respond within 30 days.</p>
    <table class="admin-table"><thead><tr><th>Reference</th><th>Member</th><th>Type</th><th>Received</th><th>Due</th><th>Status</th></tr></thead>
      <tbody id="dsrTable"></tbody></table>
  </main>
</div>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script src="js/demo-profiles.js"></script>
<script src="js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var dsr = LocalStore.get('bopeu_dsr')||[];
  document.getElementById('dsrTable').innerHTML = dsr.length ? dsr.map(function(d){
    var due = new Date(new Date(d.at).getTime() + 30*24*3600*1000).toISOString().slice(0,10);
    return '<tr><td><strong>'+d.id+'</strong></td><td>—</td><td>'+d.kind+'</td><td>'+new Date(d.at).toISOString().slice(0,10)+'</td><td>'+due+'</td><td><span class="badge badge-blue">'+d.status+'</span></td></tr>';
  }).join('') : '<tr><td colspan="6"><div class="empty">No data requests yet.</div></td></tr>';
});
</script>
</body></html>
