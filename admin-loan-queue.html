<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Loan Applications · BOPEU</title>
<link rel="stylesheet" href="design-system.css">
<style>
body.bop{background:#F2F5F9}
.admin-header{background:#1A202C;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;bottom:0;z-index:20}
.admin-layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 118px)}
.admin-side{background:#fff;border-right:1px solid #E2E8F0;padding:16px 12px}
.admin-side a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;color:#4A5568;text-decoration:none;margin-bottom:2px}
.admin-side a.active{background:#FFEBEE;color:#D32F2F}
.admin-main{padding:24px;max-width:1200px}
.grid{display:grid;grid-template-columns:340px 1fr;gap:16px}
.list{background:#fff;border:1px solid #E2E8F0;border-radius:12px;overflow:hidden}
.list-item{padding:12px;border-bottom:1px solid #E2E8F0;cursor:pointer;transition:background .15s}
.list-item:hover{background:#FAFBFD}
.list-item.active{background:#FFEBEE;border-left:3px solid #D32F2F}
.list-item .name{font-weight:800;font-size:14px}
.list-item .meta{font-size:12px;color:#718096;margin-top:2px}
.detail{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:20px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
@media(max-width:820px){.admin-layout{grid-template-columns:1fr}.admin-side{display:none}}
</style>
</head>
<body data-page-id="Page-admin-loan-queue" class="bop">

<div class="app-header">
    <img src="Assets/logo/bopeu_logo.webp" alt="BOPEU" class="app-logo" data-logo-key="bopeu">
    <button type="button" id="loginToggleBtn" class="btn header-login-btn btn-secondary" onclick="handleLoginToggle()">Logout</button>
</div>

<div class="admin-layout">
  <aside class="admin-side">
    <a href="admin-funeral-claims.html">⚰️ Funeral Claims</a>
    <a href="admin-bursary-queue.html">🎓 Bursary Queue</a>
    <a href="admin-loan-queue.html" class="active">💰 Loan Queue</a>
    <a href="admin-insurance-quotes.html">🛡️ Insurance Quotes</a>
  </aside>
  <main class="admin-main">
    <h1 style="font-size:22px;font-weight:800;margin-bottom:4px;">Loan Applications</h1>
    <p style="color:#718096;font-size:14px;margin-bottom:20px;">Affordability check + approval queue</p>
    <div class="grid">
      <div class="list" id="list"></div>
      <div class="detail" id="detail"></div>
    </div>
  </main>
</div>
<script>
var APPS = [
  { id:'LOAN-2026-041', member:'Kabelo Modise', type:'Emergency Loan', amount:15000, term:24, salary:12100, savings:9240, existing:920, submitted:'2026-10-18', status:'pending-review' },
  { id:'LOAN-2026-042', member:'Patricia Kgaope', type:'Ordinary Loan', amount:50000, term:36, salary:10750, savings:13250, existing:0, submitted:'2026-10-20', status:'pending-review' },
  { id:'LOAN-2026-043', member:'Siyanda Kefitlile', type:'Micro-loan', amount:4500, term:6, salary:5280, savings:3760, existing:0, submitted:'2026-10-22', status:'pending-review' }
];

function calcMonthly(amount, term, rate) {
  if (!rate) return amount / term;
  var pow = Math.pow(1 + rate, term);
  return (amount * rate * pow) / (pow - 1);
}

function renderList() {
  var html = '';
  APPS.forEach((a, i) => {
    html += '<div class="list-item' + (i===0?' active':'') + '" onclick="openApp(' + i + ')">' +
      '<div class="name">' + a.member + '</div>' +
      '<div class="meta">' + a.id + ' · P ' + a.amount.toLocaleString() + '</div>' +
      '<div class="meta">' + a.type + '</div>' +
      '</div>';
  });
  document.getElementById('list').innerHTML = html;
  openApp(0);
}

function openApp(i) {
  document.querySelectorAll('.list-item').forEach((el, idx) => el.classList.toggle('active', idx===i));
  var a = APPS[i];
  var rate = a.type === 'Emergency Loan' ? 0.06/12 : a.type === 'Ordinary Loan' ? 0.08/12 : 0;
  var monthly = calcMonthly(a.amount, a.term, rate);
  var totalDeductions = monthly + a.existing + 100 + 70 + 39.50; // loan + existing + subscriptions
  var disposable = a.salary - totalDeductions;
  var risk = totalDeductions > a.salary * 0.4 ? 'HIGH' : disposable < 1000 ? 'MEDIUM' : 'LOW';
  var riskColor = risk === 'HIGH' ? '#B71C1C' : risk === 'MEDIUM' ? '#E65100' : '#2E7D32';

  document.getElementById('detail').innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;"><div><h2 style="margin:0;font-size:18px;">' + a.member + '</h2><p style="color:#718096;font-size:13px;margin:4px 0 0;">' + a.id + ' · ' + a.type + '</p></div><span class="badge badge-blue">' + a.status + '</span></div>' +
    '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;">' +
      '<div class="stat"><div class="stat-label">Requested amount</div><div class="stat-value">P ' + a.amount.toLocaleString() + '</div></div>' +
      '<div class="stat"><div class="stat-label">Term</div><div class="stat-value">' + a.term + ' months</div></div>' +
      '<div class="stat"><div class="stat-label">Monthly instalment</div><div class="stat-value">P ' + monthly.toFixed(2) + '</div></div>' +
      '<div class="stat"><div class="stat-label">Existing obligations</div><div class="stat-value">P ' + a.existing.toFixed(2) + '</div></div>' +
    '</div>' +
    '<h3 style="margin:16px 0 8px;font-size:14px;">Affordability assessment</h3>' +
    '<div style="background:#F7F9FC;padding:16px;border-radius:8px;font-size:13px;line-height:1.8;">' +
      'Basic salary: <strong>P ' + a.salary.toLocaleString() + '</strong><br>' +
      'Total deductions (loan + existing + subscriptions): <strong>P ' + totalDeductions.toFixed(2) + '</strong><br>' +
      'Net disposable: <strong>P ' + disposable.toFixed(2) + '</strong><br>' +
      'Debt-to-income: <strong>' + ((totalDeductions/a.salary)*100).toFixed(1) + '%</strong><br>' +
      'Risk rating: <strong style="color:' + riskColor + ';">' + risk + '</strong>' +
    '</div>' +
    '<div class="callout" style="margin-top:14px;background:' + (risk === 'HIGH' ? '#FFEBEE' : '#E8F5E9') + ';border-left-color:' + riskColor + ';">' +
      '<span class="callout-label">Recommendation</span>' +
      '<p>' + (risk === 'HIGH' ? '⚠️ Debt-to-income exceeds 40%. Recommend reducing amount or extending term.' : '✓ Applicant can service this loan based on affordability rules.') + '</p>' +
    '</div>' +
    '<div class="btn-row mt-md">' +
      '<button class="btn btn-secondary" onclick="alert(\'Reject with reason (demo).\')">Reject</button>' +
      '<button class="btn btn-primary" ' + (risk === 'HIGH' ? 'disabled' : '') + ' onclick="approve(\'' + a.id + '\')">Approve loan</button>' +
    '</div>';
}

function approve(id) {
  if (!confirm('Approve loan ' + id + '?')) return;
  var a = APPS.find(x => x.id === id);
  if (a) a.status = 'approved';
  alert('Approved. Loan will be disbursed on the next payment run.');
  openApp(APPS.indexOf(a));
}

renderList();
</script>

<script src="js/demo-profiles.js"></script>
<script src="js/auth.js"></script>

<header class="admin-header">
  <nav style="display:flex;gap:16px;font-size:13px;"><a href="admin-funeral-claims.html" style="color:#fff;text-decoration:none;font-weight:600;opacity:.85;">Welfare</a></nav>
</header>
</body>
</html>
