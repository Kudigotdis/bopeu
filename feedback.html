<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Feedback · BOPEU</title><link rel="stylesheet" href="design-system.css"></head>
<body class="bop">
<header style="background:#fff;border-bottom:1px solid #E2E8F0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;">
  <a href="index.html" style="display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;">
    <div style="width:32px;height:32px;border-radius:8px;background:#D32F2F;color:#fff;display:grid;place-items:center;font-weight:800;">B</div>
    <div><div style="font-weight:800;font-size:14px;">BOPEU</div><div style="font-size:10px;color:#718096;">MEMBER SERVICES</div></div>
  </a>
  <a href="index.html" style="font-size:13px;font-weight:700;color:#D32F2F;text-decoration:none;">← Home</a>
</header>
<main class="page stack">
  <div class="card"><div class="card-head"><h2>Leave feedback</h2><div class="card-sub">Your feedback helps us improve benefits and partner services.</div></div>
    <div class="card-body">
      <div class="form-group"><label class="form-label">Feedback type</label><select id="fbType"><option value="partner">Partner benefit</option><option value="service">BOPEU service</option><option value="portal">Portal / app</option></select></div>
      <div class="form-group"><label class="form-label">Subject / reference (optional)</label><input type="text" id="fbSubject" placeholder="e.g. Absa Bank, Ref ABC-123"></div>
      <div class="form-group"><label class="form-label">Rating</label>
        <div id="starRow" style="display:flex;gap:6px;font-size:28px;color:#E2E8F0;cursor:pointer;">
          <span data-v="1" onclick="setStar(1)">★</span><span data-v="2" onclick="setStar(2)">★</span><span data-v="3" onclick="setStar(3)">★</span><span data-v="4" onclick="setStar(4)">★</span><span data-v="5" onclick="setStar(5)">★</span>
        </div>
      </div>
      <div class="form-group"><label class="form-label">Comments</label><textarea id="fbText" rows="4" style="width:100%;padding:10px;border:1px solid #E2E8F0;border-radius:10px;font-family:inherit;font-size:14px;" placeholder="What worked well? What could be better?"></textarea></div>
      <button class="btn btn-primary btn-block" onclick="submitFeedback()">Submit feedback</button>
    </div>
  </div>
</main>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>
var FB_STAR=0;
function setStar(v){ FB_STAR=v; document.querySelectorAll('#starRow span').forEach(function(s){ s.style.color = (+s.dataset.v<=v) ? '#F0A92B' : '#E2E8F0'; }); }
function submitFeedback(){
  if (!FB_STAR){ alert('Please choose a rating.'); return; }
  var list = LocalStore.get('bopeu_feedback')||[];
  list.unshift({ id:'FB-'+Date.now(), type:document.getElementById('fbType').value, subject:document.getElementById('fbSubject').value, rating:FB_STAR, text:document.getElementById('fbText').value, at:new Date().toISOString() });
  LocalStore.set('bopeu_feedback',list);
  alert('Thank you — feedback recorded.');
  document.getElementById('fbText').value=''; document.getElementById('fbSubject').value=''; FB_STAR=0; setStar(0);
}
</script>
</body></html>
