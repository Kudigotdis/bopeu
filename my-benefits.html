<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Benefits · BOPEU</title><link rel="stylesheet" href="design-system.css"></head>
<body data-page-id="Page-my-benefits" class="bop">
<header style="background:#fff;border-bottom:1px solid #E2E8F0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;">
  <a href="index.html" style="display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;">
    <div style="width:32px;height:32px;border-radius:8px;background:#D32F2F;color:#fff;display:grid;place-items:center;font-weight:800;">B</div>
    <div><div style="font-weight:800;font-size:14px;">BOPEU</div><div style="font-size:10px;color:#718096;">MEMBER SERVICES</div></div>
  </a>
  <a href="index.html" style="font-size:13px;font-weight:700;color:#D32F2F;text-decoration:none;">← Home</a>
</header>
<main class="page stack">
  <div class="chip-row" id="benefitFilter">
    <button class="chip active" onclick="filterBenefits('All',this)">All</button>
    <button class="chip" onclick="filterBenefits('Health',this)">Health</button>
    <button class="chip" onclick="filterBenefits('Finance',this)">Finance</button>
    <button class="chip" onclick="filterBenefits('Insurance',this)">Insurance</button>
    <button class="chip" onclick="filterBenefits('Travel',this)">Travel</button>
  </div>
  <div class="row-list" id="benefitList"></div>
</main>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>
function filterBenefits(cat, btn){
  document.querySelectorAll('#benefitFilter .chip').forEach(function(b){ b.classList.toggle('active', b===btn); });
  renderList(cat);
}
function renderList(cat){
  var list = BOPEU_BENEFIT_PARTNERS.filter(function(p){ return cat==='All' || p.sector===cat; });
  document.getElementById('benefitList').innerHTML = list.map(function(p){
    var status = p.status==='verified' ? '<span class="status verified">Confirmed</span>' : '<span class="status coming">Apply</span>';
    return '<a class="row" href="offer-detail.html?id='+p.id+'">' +
      '<div class="row-icon logo">'+(p.logo?'<img src="'+p.logo+'" alt="" onerror="this.style.display=\'none\'">':'<span>'+p.icon+'</span>')+'</div>' +
      '<div class="row-body"><div class="row-title">'+p.name+'</div><div class="row-desc">'+p.discount+'</div></div>' + status + '</a>';
  }).join('') || '<div class="empty">No partners in this category.</div>';
}
document.addEventListener('DOMContentLoaded', function(){ renderList('All'); });
</script>
</body></html>
