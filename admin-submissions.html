<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submissions · BOPEU Admin</title>
<link rel="stylesheet" href="design-system.css">
<style>
  body.bop { background:#F2F5F9; }
  .admin-header { background:#1A202C; color:#fff; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; position:sticky; bottom:0; z-index:20; }
  .admin-brand { display:flex; align-items:center; gap:10px; }
  .admin-mark { width:32px; height:32px; border-radius:8px; background:#D32F2F; display:grid; place-items:center; font-weight:800; color:#fff; }
  .admin-nav { display:flex; gap:16px; font-size:13px; }
  .admin-nav a { color:#fff; text-decoration:none; font-weight:600; opacity:.85; }
  .admin-nav a.active { opacity:1; text-decoration:underline; }
  .admin-layout { display:grid; grid-template-columns:220px 1fr; min-height:calc(100vh - 56px); }
  .admin-side { background:#fff; border-right:1px solid #E2E8F0; padding:16px 12px; }
  .admin-side a { display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:8px; font-size:13px; font-weight:600; color:#4A5568; text-decoration:none; margin-bottom:2px; }
  .admin-side a:hover { background:#F7F9FC; color:#D32F2F; }
  .admin-side a.active { background:#FFEBEE; color:#D32F2F; }
  .admin-main { padding:24px; max-width:1200px; }
  .filter-bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .filter-bar input, .filter-bar select { flex:1 1 200px; padding:10px 12px; border:1px solid #E2E8F0; border-radius:10px; font-family:inherit; font-size:14px; background:#fff; }
  .admin-table { width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.03); }
  .admin-table th { background:#F7F9FC; text-align:left; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:#718096; padding:12px; border-bottom:1px solid #E2E8F0; }
  .admin-table td { padding:12px; border-bottom:1px solid #E2E8F0; font-size:14px; color:#1A202C; }
  .admin-table tr:hover td { background:#FAFBFD; }
  .admin-table tr:last-child td { border-bottom:0; }
  @media (max-width:820px) { .admin-layout { grid-template-columns:1fr; } .admin-side { display:none; } }
</style>
</head>
<body data-page-id="Page-admin-submissions" class="bop">

<div class="admin-layout">
  <aside class="admin-side">
    <a href="admin-dashboard.html">📊 Dashboard</a>
    <a href="admin-submissions.html" class="active">📥 Submissions</a>
    <a href="admin-members.html">👥 Members</a>
    <a href="admin-content.html">📰 Content</a>
    <a href="admin-users-roles.html">🔐 Users &amp; Roles</a>
    <a href="admin-audit-log.html">📜 Audit Log</a>
    <a href="admin-reports.html">📈 Reports</a>
  </aside>

  <main class="admin-main">
    <h1 style="font-size:22px; font-weight:800; margin-bottom:4px;">Submissions</h1>
    <p style="color:#718096; font-size:14px; margin-bottom:20px;">All applications, grievances and claims. Filter by type, status or office.</p>

    <div class="filter-bar">
      <input type="text" id="subSearch" placeholder="Search by reference, member or office…" oninput="renderSubmissions()">
      <select id="subType" onchange="renderSubmissions()">
        <option value="">All types</option>
        <option value="bursary">Bursary</option>
        <option value="loan">Loan</option>
        <option value="funeral">Funeral cover</option>
        <option value="building">Building materials</option>
        <option value="grievance">Grievance</option>
        <option value="membership">Membership</option>
      </select>
      <select id="subStatus" onchange="renderSubmissions()">
        <option value="">All statuses</option>
        <option value="submitted">Submitted</option>
        <option value="verified">Verified</option>
        <option value="office_review">At office</option>
        <option value="approved">Approved</option>
        <option value="disbursed">Disbursed</option>
        <option value="rejected">Rejected</option>
      </select>
    </div>

    <div id="submissionsTable"></div>
  </main>
</div>

<div class="modal" id="admin-modal" data-view-id="Page-admin-submissions-admin-modal" style="position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(15,23,32,.55);">
  <div style="width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:#fff;border-radius:16px;padding:20px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #E2E8F0;">
      <h2 style="font-size:18px;font-weight:800;margin:0;" id="adminModalTitle">Admin</h2>
      <button style="background:none;border:none;font-size:24px;cursor:pointer;color:#718096;" onclick="closeModal('admin-modal')">&times;</button>
    </div>
    <div id="adminModalBody"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/demo-profiles.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
<script>
  // Demo submissions data — real submissions arrive via localStorage.
  var DEMO_SUBMISSIONS = [
    { id: 'BUR-1730000001', type: 'bursary',   label: 'Educational Bursary',   officeName: 'Gaborone',  submittedAt: '2026-09-10T09:12:00Z', status: 'office_review', applicant: 'Kabelo Modise' },
    { id: 'LOA-1730000002', type: 'loan',      label: 'BOPEU Direct Loan',     officeName: 'Palapye',   submittedAt: '2026-09-12T14:30:00Z', status: 'submitted',     applicant: 'Kelebogile Moseki' },
    { id: 'FUN-1730000003', type: 'funeral',   label: 'BOPEU Funeral Cover',   officeName: 'Gaborone',  submittedAt: '2026-09-13T11:05:00Z', status: 'verified',      applicant: 'Tumelo Rantao' },
    { id: 'BUI-1730000004', type: 'building',  label: 'Building Materials',    officeName: 'Maun',      submittedAt: '2026-09-14T08:00:00Z', status: 'approved',      applicant: 'Boitumelo Lesego' },
    { id: 'GRI-1730000005', type: 'grievance', label: 'Grievance / Support',   officeName: 'Francistown', submittedAt: '2026-09-15T16:45:00Z', status: 'submitted',   applicant: 'Olorato Keaikitse' },
    { id: 'BUR-1730000006', type: 'bursary',   label: 'Educational Bursary',   officeName: 'Gaborone',  submittedAt: '2026-09-16T10:20:00Z', status: 'rejected',      applicant: 'Moakofi Sethunya' }
  ];

  function allSubmissions() {
    var live = LocalStore.get('bopeu_applications') || [];
    // Attach applicant name from mock member if we can match by any data.
    return DEMO_SUBMISSIONS.concat(live);
  }

  function renderSubmissions() {
    var q = (document.getElementById('subSearch').value || '').toLowerCase();
    var t = document.getElementById('subType').value;
    var s = document.getElementById('subStatus').value;

    var rows = allSubmissions().filter(function (r) {
      if (t && r.type !== t) return false;
      if (s && r.status !== s) return false;
      if (q) {
        var hay = (r.id + ' ' + (r.label || '') + ' ' + (r.officeName || '') + ' ' + (r.applicant || '')).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });

    var wrap = document.getElementById('submissionsTable');
    if (!rows.length) {
      wrap.innerHTML = '<div class="empty">No submissions match your filters.</div>';
      return;
    }
    var statusClass = { submitted: 'badge-blue', verified: 'badge-blue', office_review: 'badge-grey', approved: 'badge-green', disbursed: 'badge-green', rejected: 'badge-red' };
    wrap.innerHTML = '<table class="admin-table"><thead><tr>' +
      '<th>Reference</th><th>Type</th><th>Applicant</th><th>Office</th><th>Submitted</th><th>Status</th><th></th>' +
      '</tr></thead><tbody>' +
      rows.map(function (r) {
        var cls = statusClass[r.status] || 'badge-grey';
        return '<tr>' +
          '<td style="font-family:ui-monospace,monospace;font-size:12px;">' + r.id + '</td>' +
          '<td><strong>' + (r.label || r.type) + '</strong></td>' +
          '<td>' + (r.applicant || '—') + '</td>' +
          '<td>' + (r.officeName || '—') + '</td>' +
          '<td>' + new Date(r.submittedAt).toLocaleDateString() + '</td>' +
          '<td><span class="badge ' + cls + '">' + (r.status || 'submitted').replace('_', ' ') + '</span></td>' +
          '<td><a href="admin-submission-detail.html?id=' + encodeURIComponent(r.id) + '" style="font-weight:700;color:#D32F2F;text-decoration:none;">Open →</a></td>' +
          '</tr>';
      }).join('') +
      '</tbody></table>';
  }

  document.addEventListener('DOMContentLoaded', function () {
    renderSubmissions();
  });
</script>

<header class="admin-header">
  <div class="admin-brand">
    <div class="admin-mark">B</div>
    <div><div style="font-weight:800; font-size:14px;">BOPEU Admin</div><div style="font-size:10px; opacity:.7;">Staff Portal</div></div>
  </div>
  <nav class="admin-nav">
    <a href="admin-dashboard.html">Dashboard</a>
    <a href="admin-submissions.html" class="active">Submissions</a>
    <a href="admin-members.html">Members</a>
    <a href="admin-content.html">Content</a>
    <a href="admin-reports.html">Reports</a>
    <a href="admin-login.html">Sign out</a>
  </nav>
</header>
</body>
</html>
