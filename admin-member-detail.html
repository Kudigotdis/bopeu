<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Detail · BOPEU Admin</title>
<link rel="stylesheet" href="design-system.css">
<style>
  body.bop { background:#F2F5F9; }
  .admin-header { background:#1A202C; color:#fff; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; position:sticky; bottom:0; z-index:20; }
  .admin-nav { display:flex; gap:16px; font-size:13px; }
  .admin-nav a { color:#fff; text-decoration:none; font-weight:600; opacity:.85; }
  .admin-layout { display:grid; grid-template-columns:220px 1fr; min-height:calc(100vh - 118px); }
  .admin-side { background:#fff; border-right:1px solid #E2E8F0; padding:16px 12px; }
  .admin-side a { display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:8px; font-size:13px; font-weight:600; color:#4A5568; text-decoration:none; margin-bottom:2px; }
  .admin-side a.active { background:#FFEBEE; color:#D32F2F; }
  .admin-main { padding:24px; max-width:900px; }
  .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .detail-item { padding:12px; background:#F7F9FC; border-radius:10px; border:1px solid #E2E8F0; }
  .detail-item .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#718096; font-weight:800; margin-bottom:4px; }
  .detail-item .val { font-size:14px; font-weight:600; color:#1A202C; }
  @media (max-width:820px) { .admin-layout { grid-template-columns:1fr; } .admin-side { display:none; } .detail-grid { grid-template-columns:1fr; } }
</style>
</head>
<body data-page-id="Page-admin-member-detail" class="bop">

<div class="app-header">
    <img src="Assets/logo/bopeu_logo.webp" alt="BOPEU" class="app-logo" data-logo-key="bopeu">
    <button type="button" id="loginToggleBtn" class="btn header-login-btn btn-secondary" onclick="handleLoginToggle()">Logout</button>
</div>

<div class="admin-layout">
  <aside class="admin-side">
    <a href="admin-dashboard.html">📊 Dashboard</a>
    <a href="admin-submissions.html">📥 Submissions</a>
    <a href="admin-members.html" class="active">👥 Members</a>
    <a href="admin-content.html">📰 Content</a>
    <a href="admin-users-roles.html">🔐 Users &amp; Roles</a>
    <a href="admin-audit-log.html">📜 Audit Log</a>
    <a href="admin-reports.html">📈 Reports</a>
  </aside>

  <main class="admin-main">
    <a href="admin-members.html" style="font-size:13px;font-weight:700;color:#D32F2F;text-decoration:none;">← Back to Members</a>

    <h1 id="memberName" style="font-size:22px;font-weight:800;margin:8px 0 4px;">Member</h1>
    <p id="memberSub" style="color:#718096;font-size:14px;margin-bottom:20px;">Loading…</p>

    <div class="card">
      <div class="card-header"><h2>Personal</h2></div>
      <div class="card-body">
        <div class="detail-grid" id="memberGrid"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h2>Employment</h2></div>
      <div class="card-body">
        <div class="detail-grid" id="employmentGrid"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h2>Actions</h2></div>
      <div class="card-body">
        <div class="btn-row">
          <button class="btn btn-primary" onclick="memberAction('activate')">Verify &amp; activate</button>
          <button class="btn btn-secondary" onclick="memberAction('suspend')">Suspend</button>
          <button class="btn btn-secondary" onclick="memberAction('message')">Send message</button>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal" id="admin-modal" data-view-id="Page-admin-member-detail-admin-modal" style="position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(15,23,32,.55);">
  <div style="width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:#fff;border-radius:16px;padding:20px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #E2E8F0;">
      <h2 style="font-size:18px;font-weight:800;margin:0;" id="adminModalTitle">Admin</h2>
      <button style="background:none;border:none;font-size:24px;cursor:pointer;color:#718096;" onclick="closeModal('admin-modal')">&times;</button>
    </div>
    <div id="adminModalBody"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/demo-profiles.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
<script>
  function loadMember() {
    var omang = new URLSearchParams(location.search).get('omang');
    var m = (BOPEU_MOCK_MEMBERS || []).find(function (x) { return x.omang === omang; });
    if (!m) {
      document.getElementById('memberName').textContent = 'Not found';
      document.getElementById('memberSub').textContent = 'Omang ' + (omang || '(missing)');
      document.getElementById('memberGrid').innerHTML = '<div class="empty">No member found for this Omang.</div>';
      return;
    }
    document.getElementById('memberName').textContent = m.name;
    document.getElementById('memberSub').textContent = m.memberNo + ' · ' + m.sectorLabel;
    document.getElementById('memberGrid').innerHTML =
      '<div class="detail-item"><div class="lbl">Full name</div><div class="val">' + m.name + '</div></div>' +
      '<div class="detail-item"><div class="lbl">Omang</div><div class="val">' + m.omang + '</div></div>' +
      '<div class="detail-item"><div class="lbl">Member no.</div><div class="val">' + m.memberNo + '</div></div>' +
      '<div class="detail-item"><div class="lbl">District</div><div class="val">' + m.district + '</div></div>' +
      '<div class="detail-item"><div class="lbl">Office</div><div class="val">' + m.office + '</div></div>' +
      '<div class="detail-item"><div class="lbl">Joined</div><div class="val">' + m.joined + '</div></div>' +
      '<div class="detail-item"><div class="lbl">Status</div><div class="val">' + m.status + '</div></div>';
    document.getElementById('employmentGrid').innerHTML =
      '<div class="detail-item"><div class="lbl">Sector</div><div class="val">' + m.sectorLabel + '</div></div>' +
      '<div class="detail-item"><div class="lbl">Employer</div><div class="val">' + m.employer + '</div></div>' +
      '<div class="detail-item"><div class="lbl">Job title</div><div class="val">' + m.jobTitle + '</div></div>' +
      '<div class="detail-item"><div class="lbl">Basic salary</div><div class="val">P ' + (m.basicSalary || 0).toLocaleString() + '</div></div>';
  }
  function memberAction(kind) {
    alert('Action "' + kind + '" recorded (demo).');
  }
  document.addEventListener('DOMContentLoaded', loadMember);
</script>

<header class="admin-header">
  <nav class="admin-nav">
    <a href="admin-dashboard.html">Dashboard</a>
    <a href="admin-submissions.html">Submissions</a>
    <a href="admin-members.html" style="text-decoration:underline;">Members</a>
  </nav>
</header>
</body>
</html>
