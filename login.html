<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · BOPEU Member Services</title>
<link rel="stylesheet" href="design-system.css">
<link rel="stylesheet" href="css/auth.css">
<style>
  body.bop { background: #F2F5F9; margin: 0; }
  .login-wrap { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 20px; }
  .login-card { width: 100%; max-width: 420px; box-sizing: border-box; background: #fff; border-radius: 20px; padding: 28px; box-shadow: 0 10px 30px rgba(16,24,40,.08); border: 1px solid #E2E8F0; }
  .login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .login-mark { width: 44px; height: 44px; border-radius: 12px; background: #D32F2F; color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 18px; }
  .login-brand h1 { font-size: 18px; margin: 0; }
  .login-brand p { font-size: 11px; color: #718096; margin: 2px 0 0; letter-spacing: .06em; }
  @media (max-width: 480px) {
    .login-card { padding: 20px; border-radius: 16px; }
    .login-wrap { padding: 12px; }
  }
</style>
</head>
<body data-page-id="Page-login" class="bop">

<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-mark">B</div>
      <div>
        <h1>BOPEU</h1>
        <p>BOTSWANA PUBLIC EMPLOYEES UNION</p>
      </div>
    </div>
    <div id="authPageBody"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/demo-profiles.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
