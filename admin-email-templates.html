<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Email Templates · BOPEU Admin</title>
<link rel="stylesheet" href="design-system.css">
<style>body.bop{background:#F2F5F9}.admin-header{background:#1A202C;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}.admin-mark{width:32px;height:32px;border-radius:8px;background:#D32F2F;display:grid;place-items:center;font-weight:800;color:#fff}.admin-layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 56px)}.admin-side{background:#fff;border-right:1px solid #E2E8F0;padding:16px 12px}.admin-side a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;color:#4A5568;text-decoration:none;margin-bottom:2px}.admin-side a.active{background:#FFEBEE;color:#D32F2F}.admin-main{padding:24px;max-width:1100px}.admin-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}.admin-table th{background:#F7F9FC;text-align:left;font-size:11px;font-weight:800;text-transform:uppercase;color:#718096;padding:12px;border-bottom:1px solid #E2E8F0}.admin-table td{padding:12px;border-bottom:1px solid #E2E8F0;font-size:13px}</style>
</head>
<body class="bop">
<header class="admin-header"><div style="display:flex;align-items:center;gap:10px;"><div class="admin-mark">B</div><div><div style="font-weight:800;font-size:14px;">BOPEU Admin</div><div style="font-size:10px;opacity:.7;">Email Templates</div></div></div></header>
<div class="admin-layout">
  <aside class="admin-side">
    <a href="admin-notifications-center.html">🔔 Notification Center</a>
    <a href="admin-email-templates.html" class="active">✉️ Email Templates</a>
    <a href="admin-sms-templates.html">📱 SMS Templates</a>
    <a href="admin-whatsapp-templates.html">💬 WhatsApp Templates</a>
  </aside>
  <main class="admin-main">
    <h1 style="font-size:22px;font-weight:800;margin-bottom:4px;">Email Templates</h1>
    <p style="color:#718096;font-size:14px;margin-bottom:20px;">Manage automated email content sent to members</p>
    <div style="text-align:right;margin-bottom:16px;"><button class="btn btn-primary" onclick="alert('Create new email template (demo).')">+ New template</button></div>
    <table class="admin-table">
      <thead><tr><th>Template name</th><th>Trigger</th><th>Last edited</th><th>Status</th><th></th></tr></thead>
      <tbody id="templates"></tbody>
    </table>
  </main>
</div>
<script>
var TP = [
  { name:'Welcome email', trigger:'New member registers', edited:'2026-10-20', status:'active' },
  { name:'Application received', trigger:'Form submission', edited:'2026-10-18', status:'active' },
  { name:'Application approved', trigger:'Staff approves', edited:'2026-10-18', status:'active' },
  { name:'Payment confirmation', trigger:'Deduction processed', edited:'2026-10-15', status:'active' },
  { name:'Claim status update', trigger:'Claim status change', edited:'2026-10-12', status:'active' },
  { name:'Password reset link', trigger:'User requests reset', edited:'2026-10-10', status:'active' },
  { name:'Monthly newsletter', trigger:'Scheduled monthly', edited:'2026-10-01', status:'active' }
];
document.getElementById('templates').innerHTML = TP.map(t => '<tr><td><strong>' + t.name + '</strong></td><td>' + t.trigger + '</td><td>' + t.edited + '</td><td><span class="badge badge-green">' + t.status + '</span></td><td><button class="btn btn-secondary btn-small" onclick="alert(\'Edit template (demo).\')">Edit</button></td></tr>').join('');
</script>

<script src="js/demo-profiles.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
